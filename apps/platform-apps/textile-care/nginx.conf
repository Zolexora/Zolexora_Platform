server {
    listen 80;
    server_name api.localhost;
    location / {
        proxy_pass http://backend:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name admin.localhost;
    location / {
        proxy_pass http://admin-web:3000;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name seller.localhost;
    location / {
        proxy_pass http://seller-web:3000;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name marketplace.localhost localhost;
    location / {
        proxy_pass http://marketplace-web:3000;
        proxy_set_header Host $host;
    }
}
