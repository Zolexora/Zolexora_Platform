server {
    listen 80;
    server_name api.localhost;
    location / {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name app.localhost localhost;
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
}
