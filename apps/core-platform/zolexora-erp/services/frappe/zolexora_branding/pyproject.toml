[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "zolexora_branding"
authors = [
    {name = "Zolexora", email = "info@zolexora.com"}
]
description = "Branding assets, themes, CSS, JS, logos, and custom website/desk UI parameters for Zolexora ERP."
dependencies = [
    "frappe>=16.0.0"
]
dynamic = ["version"]

[project.urls]
Homepage = "https://zolexora.com"
