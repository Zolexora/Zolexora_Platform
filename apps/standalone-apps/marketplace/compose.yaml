# Project name pinned to the pre-rename folder name so existing volumes, networks and containers are kept.
name: zolexora-shop
services:
  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:15-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_USER: zolexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - run via scripts/setup/with-infisical.sh}
      POSTGRES_DB: marketplace
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U zolexora -d marketplace
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  backend:
    image: ${MARKETPLACE_BACKEND_IMAGE:-ghcr.io/zolexora/zolexora-shop-backend:latest}
    pull_policy: missing
    container_name: marketplace-backend
    environment:
    # All values come from Infisical (scripts/setup/with-infisical.sh); `${VAR:?}` ones block startup.
    - APP_ENV=${APP_ENV:?APP_ENV missing - run via scripts/setup/with-infisical.sh}
    - DATABASE_URL=postgresql://zolexora:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - run via scripts/setup/with-infisical.sh}@postgres:5432/marketplace
    - REDIS_URL=redis://redis:6379/0
    # Every token is checked by the Zolexora auth service; admins are its platform admins.
    - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:?AUTH_SERVICE_URL missing - run via scripts/setup/with-infisical.sh}
    - MARKETPLACE_IN_DOCKER=1
    - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS missing - run via scripts/setup/with-infisical.sh}
    - TRUSTED_PROXIES
    - CLOUDINARY_CLOUD_NAME
    - CLOUDINARY_API_KEY
    - CLOUDINARY_API_SECRET
    - RAZORPAY_KEY_ID
    - RAZORPAY_KEY_SECRET
    - RAZORPAY_WEBHOOK_SECRET
    - CASHFREE_ENVIRONMENT
    - CASHFREE_CLIENT_ID
    - CASHFREE_CLIENT_SECRET
    - SHIPPING_WEBHOOK_SECRET
    - ERP_WEBHOOK_SECRET
    - UPI_ID
    - SENTRY_DSN
    - UPI_MERCHANT_NAME
    - SELLER_KYC_ENCRYPTION_KEY
    - CHECKOUT_QUOTE_SIGNING_SECRET
    - CHECKOUT_QUOTE_EXPIRY_MINUTES
    - MAX_CART_QUANTITY
    - ZOLEXORA_SHOP_PAYMENT_PROVIDER
    - MAHILA_MADEL_PAYMENT_PROVIDER
    - DATABASE_POOL_MIN
    - DATABASE_POOL_MAX
    - DATABASE_COMMAND_TIMEOUT
    - REDIS_NAMESPACE
    - REDIS_POOL_MAX
    - REDIS_CONNECT_TIMEOUT
    - SHIPROCKET_WEBHOOK_SECRET
    - SHIPROCKET_BASE_URL
    - SHIPROCKET_EMAIL
    - SHIPROCKET_PASSWORD
    - DELHIVERY_API_TOKEN
    - DELHIVERY_BASE_URL
    - NIMBUSPOST_API_KEY
    - NIMBUSPOST_BASE_URL
    - DTDC_API_KEY
    - DTDC_API_SECRET
    - DTDC_BASE_URL
    - BLUEDART_API_KEY
    - BLUEDART_API_SECRET
    - BLUEDART_BASE_URL
    - INDIAPOST_API_KEY
    - INDIAPOST_BASE_URL
    - PICKRR_API_KEY
    - PICKRR_BASE_URL
    - SHIPWAY_API_KEY
    - SHIPWAY_BASE_URL
    - GOOGLE_ADDRESS_VALIDATION_API_KEY
    - GST_CLEARTAX_BASE_URL
    - GST_CLEARTAX_AUTH_TOKEN
    - GST_CLEARTAX_TAXABLE_ENTITY_ID
    - GST_LOOKUP_MODE
    extra_hosts:
    - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  admin-web:
    image: ${MARKETPLACE_ADMIN_WEB_IMAGE:-ghcr.io/zolexora/zolexora-shop-admin-web:latest}
    pull_policy: missing
    container_name: marketplace-admin-web
    # Public, browser-safe config from Infisical, read at runtime (never baked into the image).
    environment: &web-env
      MARKETPLACE_API_URL: ${MARKETPLACE_API_URL:?MARKETPLACE_API_URL missing - run via scripts/setup/with-infisical.sh}
      AUTH_SERVICE_PUBLIC_URL: ${AUTH_SERVICE_PUBLIC_URL:?AUTH_SERVICE_PUBLIC_URL missing - run via scripts/setup/with-infisical.sh}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY missing - run via scripts/setup/with-infisical.sh}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:?FIREBASE_WEB_API_KEY missing - run via scripts/setup/with-infisical.sh}
      FIREBASE_WEB_AUTH_DOMAIN: ${FIREBASE_WEB_AUTH_DOMAIN:?FIREBASE_WEB_AUTH_DOMAIN missing - run via scripts/setup/with-infisical.sh}
      FIREBASE_WEB_PROJECT_ID: ${FIREBASE_WEB_PROJECT_ID:?FIREBASE_WEB_PROJECT_ID missing - run via scripts/setup/with-infisical.sh}
      FIREBASE_WEB_APP_ID: ${FIREBASE_WEB_APP_ID:?FIREBASE_WEB_APP_ID missing - run via scripts/setup/with-infisical.sh}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  seller-web:
    image: ${MARKETPLACE_SELLER_WEB_IMAGE:-ghcr.io/zolexora/zolexora-shop-seller-web:latest}
    pull_policy: missing
    container_name: marketplace-seller-web
    environment: *web-env
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  shop-web:
    image: ${MARKETPLACE_SHOP_WEB_IMAGE:-ghcr.io/zolexora/zolexora-shop-shop-web:latest}
    pull_policy: missing
    container_name: marketplace-shop-web
    environment: *web-env
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  mahila-web:
    image: ${MARKETPLACE_MAHILA_WEB_IMAGE:-ghcr.io/zolexora/zolexora-shop-mahila-web:latest}
    pull_policy: missing
    container_name: marketplace-mahila-web
    environment: *web-env
    volumes:
    # Writes /env-config.js from the environment when nginx starts.
    - ./scripts/web-env-config.sh:/docker-entrypoint.d/40-env-config.sh:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  nginx:
    image: ${MARKETPLACE_NGINX_IMAGE:-ghcr.io/zolexora/zolexora-shop-nginx:latest}
    pull_policy: missing
    container_name: marketplace-nginx
    ports:
    - "3079:80"
    depends_on:
    - backend
    - admin-web
    - seller-web
    - shop-web
    - mahila-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M


volumes:
  postgres_data:
