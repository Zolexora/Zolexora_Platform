services:
  platform-admin-postgres:
    image: postgres:16-alpine
    container_name: platform-admin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PLATFORM_ADMIN_POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${PLATFORM_ADMIN_POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB: ${PLATFORM_ADMIN_POSTGRES_DB:-platform_admin}
    volumes:
      - platform_admin_postgres_data:/var/lib/postgresql/data
    ports:
      - "${PLATFORM_ADMIN_POSTGRES_PORT:-5450}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLATFORM_ADMIN_POSTGRES_USER:-admin} -d ${PLATFORM_ADMIN_POSTGRES_DB:-platform_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  platform-admin-backend:
    image: ${PLATFORM_ADMIN_BACKEND_IMAGE:-ghcr.io/zolexora/platform-admin-backend:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: apps/platform-admin/backend/Dockerfile
    container_name: platform-admin-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PLATFORM_ADMIN_BACKEND_PORT:-4041}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - DATABASE_URL=postgresql://${PLATFORM_ADMIN_POSTGRES_USER:-admin}:${PLATFORM_ADMIN_POSTGRES_PASSWORD:-adminpassword}@platform-admin-postgres:5432/${PLATFORM_ADMIN_POSTGRES_DB:-platform_admin}
      - INFISICAL_TOKEN=${INFISICAL_TOKEN:-}
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID:-}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET:-}
      - INFISICAL_WORKSPACE_ID=${INFISICAL_WORKSPACE_ID:-}
      - INFISICAL_SITE_URL=${INFISICAL_SITE_URL:-https://app.infisical.com}
      - SUPABASE_CORE_URL=${SUPABASE_CORE_URL:-}
      - SUPABASE_CORE_SERVICE_KEY=${SUPABASE_CORE_SERVICE_KEY:-}
      - SUPABASE_CORE_PG_URL=${SUPABASE_CORE_PG_URL:-}
      - SUPABASE_COMMERCE_URL=${SUPABASE_COMMERCE_URL:-}
      - SUPABASE_COMMERCE_SERVICE_KEY=${SUPABASE_COMMERCE_SERVICE_KEY:-}
      - SUPABASE_COMMERCE_PG_URL=${SUPABASE_COMMERCE_PG_URL:-}
      - SUPABASE_BUSINESS_URL=${SUPABASE_BUSINESS_URL:-}
      - SUPABASE_BUSINESS_SERVICE_KEY=${SUPABASE_BUSINESS_SERVICE_KEY:-}
      - SUPABASE_BUSINESS_PG_URL=${SUPABASE_BUSINESS_PG_URL:-}
      - SUPABASE_AI_ERP_URL=${SUPABASE_AI_ERP_URL:-}
      - SUPABASE_AI_ERP_SERVICE_KEY=${SUPABASE_AI_ERP_SERVICE_KEY:-}
      - SUPABASE_AI_ERP_PG_URL=${SUPABASE_AI_ERP_PG_URL:-}
      - MONGO_URI=${MONGO_URI:-}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - FIREBASE_ACTIVE_ACCOUNTS=${FIREBASE_ACTIVE_ACCOUNTS:-}
    depends_on:
      platform-admin-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 5

  platform-admin-frontend:
    image: ${PLATFORM_ADMIN_FRONTEND_IMAGE:-ghcr.io/zolexora/platform-admin-frontend:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: apps/platform-admin/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4041}
    container_name: platform-admin-frontend
    restart: unless-stopped
    ports:
      - "${PLATFORM_ADMIN_FRONTEND_PORT:-3092}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4041}
    depends_on:
      platform-admin-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3

  platform-admin-nginx:
    image: ${PLATFORM_ADMIN_NGINX_IMAGE:-ghcr.io/zolexora/platform-admin-nginx:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: apps/platform-admin/Dockerfile.nginx
    container_name: platform-admin-nginx
    restart: unless-stopped
    ports:
      - "${PLATFORM_ADMIN_GATEWAY_PORT:-3095}:80"
    depends_on:
      platform-admin-backend:
        condition: service_healthy
      platform-admin-frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  platform_admin_postgres_data:
