version: '3.8'

services:
  platform-admin-frontend:
    build:
      context: ../../
      dockerfile: apps/platform-admin/frontend/Dockerfile
    ports:
      - "3082:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3081
    depends_on:
      platform-admin-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  platform-admin-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3081:8000"
    environment:
      - ENVIRONMENT=development
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
