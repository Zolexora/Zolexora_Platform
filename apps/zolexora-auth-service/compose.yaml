services:
  auth-postgres:
    image: postgres:16-alpine
    container_name: zolexora-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-auth_admin}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:-auth_secret_dev_pass}
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-zolexora_auth}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
      - ../../scripts/db/auth-service-schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${AUTH_POSTGRES_PORT:-5451}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER:-auth_admin} -d ${AUTH_POSTGRES_DB:-zolexora_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  auth-service:
    image: ${AUTH_SERVICE_IMAGE:-ghcr.io/zolexora/zolexora-auth-service:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: apps/zolexora-auth-service/Dockerfile
    container_name: zolexora-auth-service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AUTH_SERVICE_PORT:-3081}:3081"
    environment:
      - NODE_ENV=production
      - PORT=3081
      - HOST=0.0.0.0
      - BASE_URL=${AUTH_BASE_URL:-http://localhost:3081}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - AUTH_DATABASE_URL=postgresql://${AUTH_POSTGRES_USER:-auth_admin}:${AUTH_POSTGRES_PASSWORD:-auth_secret_dev_pass}@auth-postgres:5432/${AUTH_POSTGRES_DB:-zolexora_auth}
      - ADMIN_DATABASE_URL=${ADMIN_DATABASE_URL:-postgresql://${AUTH_POSTGRES_USER:-auth_admin}:${AUTH_POSTGRES_PASSWORD:-auth_secret_dev_pass}@auth-postgres:5432/${AUTH_POSTGRES_DB:-zolexora_auth}}
      - SESSION_SECRET=${SESSION_SECRET:-zolexora-platform-auth-secret-key-32bytes-min}
      - STORAGE_SIGNING_SECRET=${STORAGE_SIGNING_SECRET:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      - TURNSTILE_EXPECTED_HOSTNAMES=${TURNSTILE_EXPECTED_HOSTNAMES:-}
      - RATE_LIMIT_MAX_ATTEMPTS=${RATE_LIMIT_MAX_ATTEMPTS:-5}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-900}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-zolexora}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - KYC_STORAGE_ENDPOINT=${KYC_STORAGE_ENDPOINT:-https://storage.zolexora.com}
      - KYC_SIGNED_URL_DEFAULT_TTL=${KYC_SIGNED_URL_DEFAULT_TTL:-900}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-zolexora-auth}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL:-}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - AUTH_FROM_EMAIL=${AUTH_FROM_EMAIL:-Zolexora <auth@zolexora.com>}
    depends_on:
      auth-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

volumes:
  auth_postgres_data:
    name: zolexora_auth_postgres_data
