# Every value comes from Infisical — run via scripts/docker-start.sh (wraps scripts/setup/with-infisical.sh).
# No defaults: Compose refuses to start if a required key is missing.
# Databases are the two Supabase projects referenced in Infisical (no local Postgres container);
# set them up with scripts/db/auth-service-{upgrade-users,schema,admin-schema}.sql, then
# scripts/db/auth-service-upgrade-identity.sql (businesses, roles, sessions, verification; safe to re-run).
services:
  auth-service:
    image: ${AUTH_SERVICE_IMAGE:-ghcr.io/zolexora/zolexora-auth-service:latest}
    pull_policy: missing
    container_name: zolexora-auth-service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AUTH_SERVICE_PORT:?AUTH_SERVICE_PORT must be set in Infisical}:${PORT:?PORT must be set in Infisical}"
    # Names only: values are passed through from the Infisical-injected environment.
    # Infisical key aliases (ZOLEXORA_*) are resolved by src/config/infisical.ts.
    environment:
      - NODE_ENV
      - PORT
      - HOST
      - BASE_URL
      - CORS_ORIGIN
      - TRUST_PROXY
      - AUTH_DATABASE_URL
      - ADMIN_DATABASE_URL
      - ZOLEXORA_AUTHENTICATION_DATABASE_URL
      - ZOLEXORA_AUTHENTICATION_INTERNAL_DATABASE_URL
      - ZOLEXORA_ADMIN_DATABASE_URL
      - SESSION_SECRET
      - TOKEN_TTL_SECONDS
      - TURNSTILE_SECRET_KEY
      - CF_TURNSTILE_SECRET_KEY
      - CLOUDFLARE_TURNSTILE_SECRET_KEY
      - TURNSTILE_VERIFY_URL
      - TURNSTILE_TIMEOUT_MS
      - TURNSTILE_EXPECTED_HOSTNAMES
      - RATE_LIMIT_MAX_ATTEMPTS
      - RATE_LIMIT_WINDOW_SECONDS
      - RATE_LIMIT_LOCKOUT_SECONDS
      - OTP_TTL_SECONDS
      - OTP_MAX_ATTEMPTS
      - CLOUDINARY_CLOUD_NAME
      - CLOUDINARY_API_KEY
      - CLOUDINARY_API_SECRET
      - ZOLEXORA_CLOUDINARY_CLOUD_NAME
      - ZOLEXORA_CLOUDINARY_API_KEY
      - ZOLEXORA_CLOUDINARY_API_SECRET
      - KYC_STORAGE_S3_ENDPOINT
      - KYC_STORAGE_S3_REGION
      - KYC_STORAGE_BUCKET
      - KYC_STORAGE_ACCESS_KEY_ID
      - KYC_STORAGE_SECRET_ACCESS_KEY
      - KYC_SIGNED_URL_DEFAULT_TTL
      - RESEND_API_KEY
      - RESEND_API_URL
      - ZOLEXORA_PRODUCTION_RESEND_API_KEY
      - ZOLEXORA_RESEND_API_KEY
      - AUTH_FROM_EMAIL
      - ZOLEXORA_AUTH_FROM_EMAIL
      - FIREBASE_PROJECT_ID
      - ZOLEXORA_FIREBASE_PROJECT_ID
      - FIREBASE_AUTH_ISSUER
      - FIREBASE_AUTH_JWKS_URL
      - FIREBASE_PNV_JWKS_URL
      - FIREBASE_PNV_ISSUER
      - FIREBASE_PNV_AUDIENCE
      - MOBILE_OTP_VERIFICATION
      - SIGNUP_TICKET_TTL_SECONDS
      # ADR 0004 / 0005: businesses, roles, business sessions, verification providers
      - AUTH_ENCRYPTION_KEY
      - AUTH_SIGNING_PRIVATE_KEY
      - INVITE_ACCEPT_URL
      - PWNED_PASSWORDS_API_URL
      - CATALOG_PRODUCT_KEYS
      - IDENTITY_VERIFICATION_PROVIDER
      - PAN_VERIFICATION_PROVIDER
      - GST_VERIFICATION_PROVIDER
      - REGISTRATION_VERIFICATION_PROVIDER
      - AUTHORITY_VERIFICATION_PROVIDER
      - BANK_VERIFICATION_PROVIDER
      - BANK_VERIFICATION_METHODS
      - UIDAI_OFFLINE_EKYC_CERT
      - DIGIO_BASE_URL
      - DIGIO_CLIENT_ID
      - DIGIO_CLIENT_SECRET
      - DIGIO_IDENTITY_TEMPLATE
      - DIGIO_PAN_TEMPLATE
      - DIGIO_REVERSE_PENNY_DROP_TEMPLATE
      - DIGIO_PENNY_DROP_TEMPLATE
      - CASHFREE_VERIFICATION_BASE_URL
      - CASHFREE_VERIFICATION_CLIENT_ID
      - CASHFREE_VERIFICATION_CLIENT_SECRET
      - GST_CLEARTAX_BASE_URL
      - GST_CLEARTAX_AUTH_TOKEN
      - GST_CLEARTAX_TAXABLE_ENTITY_ID
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://localhost:$$PORT/health\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
