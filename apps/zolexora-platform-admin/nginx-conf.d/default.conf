# ==============================================================================
# Zolexora Platform Admin — Nginx Reverse Proxy Gateway
# Routes:
#   - /api/     -> platform-admin-backend:8000
#   - /docs     -> platform-admin-backend:8000/docs (Swagger UI)
#   - /openapi  -> platform-admin-backend:8000/openapi.json
#   - /redoc    -> platform-admin-backend:8000/redoc
#   - /healthz  -> Direct 200 response (Nginx health check)
#   - /         -> platform-admin-frontend:3000 (Next.js Dashboard)
# ==============================================================================

server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 "";

    client_max_body_size 50M;

    # Gzip compression for API payloads and frontend assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss;

    # 1. Direct Gateway Liveness Probe
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # 2. FastAPI Backend API Routes
    location /api/ {
        proxy_pass http://platform-admin-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 3. Interactive API Documentation
    location /docs {
        proxy_pass http://platform-admin-backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://platform-admin-backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://platform-admin-backend:8000/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Next.js Static Asset Caching
    location /_next/static/ {
        proxy_pass http://platform-admin-frontend:3000/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # 5. Next.js Web Frontend & Navigation
    location / {
        proxy_pass http://platform-admin-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
