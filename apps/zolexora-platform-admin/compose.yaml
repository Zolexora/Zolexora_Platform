services:
  platform-admin-backend:
    image: ${PLATFORM_ADMIN_BACKEND_IMAGE:-ghcr.io/zolexora/zolexora-platform-admin-backend:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: apps/zolexora-platform-admin/backend/Dockerfile
    container_name: platform-admin-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Localhost only: browsers reach the API through the gateway (3095).
      - "127.0.0.1:${PLATFORM_ADMIN_BACKEND_PORT:-4041}:8000"
    # Names only: values are passed through from the Infisical-injected environment.
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - AUTH_SERVICE_URL
      - CORS_ORIGINS
      - SUPABASE_CORE_URL
      - SUPABASE_CORE_SERVICE_KEY
      - SUPABASE_CORE_PG_URL
      - SUPABASE_COMMERCE_URL
      - SUPABASE_COMMERCE_SERVICE_KEY
      - SUPABASE_COMMERCE_PG_URL
      - SUPABASE_BUSINESS_URL
      - SUPABASE_BUSINESS_SERVICE_KEY
      - SUPABASE_BUSINESS_PG_URL
      - SUPABASE_AI_ERP_URL
      - SUPABASE_AI_ERP_SERVICE_KEY
      - SUPABASE_AI_ERP_PG_URL
      - MONGO_URI
      - CF_ACCOUNT_ID
      - R2_ACCOUNT_ID
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - R2_BUCKET_IMS
      - R2_BUCKET_MARKETPLACE
      - R2_BUCKET_TMS
      - R2_BUCKET_DEFAULT
      - RESEND_API_KEY
      - BREVO_API_KEY
      - SENDGRID_API_KEY
      - FIREBASE_ACTIVE_ACCOUNTS
    volumes:
      - platform_admin_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 5

  platform-admin-frontend:
    image: ${PLATFORM_ADMIN_FRONTEND_IMAGE:-ghcr.io/zolexora/zolexora-platform-admin-frontend:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: apps/zolexora-platform-admin/frontend/Dockerfile
    container_name: platform-admin-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PLATFORM_ADMIN_FRONTEND_PORT:-3092}:3000"
    # Read per request by the root layout, so the image is the same in every environment.
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_PUBLIC_URL
      - TURNSTILE_SITE_KEY
    depends_on:
      platform-admin-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3

  platform-admin-nginx:
    image: ${PLATFORM_ADMIN_NGINX_IMAGE:-ghcr.io/zolexora/zolexora-platform-admin-nginx:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: apps/zolexora-platform-admin/Dockerfile.nginx
    container_name: platform-admin-nginx
    restart: unless-stopped
    ports:
      - "${PLATFORM_ADMIN_GATEWAY_PORT:-3095}:80"
    depends_on:
      platform-admin-backend:
        condition: service_healthy
      platform-admin-frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  platform_admin_data:
