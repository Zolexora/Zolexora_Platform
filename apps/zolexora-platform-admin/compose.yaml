services:
  platform-admin-backend:
    image: ${PLATFORM_ADMIN_BACKEND_IMAGE:-ghcr.io/zolexora/zolexora-platform-admin-backend:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: apps/zolexora-platform-admin/backend/Dockerfile
    container_name: platform-admin-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Localhost only: browsers reach the API through the gateway (3095).
      - "127.0.0.1:${PLATFORM_ADMIN_BACKEND_PORT:-4041}:8000"
    # Names only, values come from the Infisical-injected environment. No provider keys here:
    # Supabase, Mongo, R2, email, Cloudflare and Firebase accounts are added in the panel
    # (Accounts -> Add connection) and stored in Infisical under <admin path>/connections.
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - AUTH_SERVICE_URL
      - CORS_ORIGINS
      - INFISICAL_CLIENT_ID
      - INFISICAL_CLIENT_SECRET
      - INFISICAL_ENV
      - INFISICAL_SITE_URL
    volumes:
      - platform_admin_data:/data
      - ./.infisical.json:/config/infisical.json:ro  # project + folder the connections live in
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 5

  platform-admin-frontend:
    image: ${PLATFORM_ADMIN_FRONTEND_IMAGE:-ghcr.io/zolexora/zolexora-platform-admin-frontend:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: apps/zolexora-platform-admin/frontend/Dockerfile
    container_name: platform-admin-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PLATFORM_ADMIN_FRONTEND_PORT:-3092}:3000"
    # Read per request by the root layout, so the image is the same in every environment.
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_PUBLIC_URL
      - TURNSTILE_SITE_KEY
    depends_on:
      platform-admin-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3

  platform-admin-nginx:
    image: ${PLATFORM_ADMIN_NGINX_IMAGE:-ghcr.io/zolexora/zolexora-platform-admin-nginx:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: apps/zolexora-platform-admin/Dockerfile.nginx
    container_name: platform-admin-nginx
    restart: unless-stopped
    ports:
      - "${PLATFORM_ADMIN_GATEWAY_PORT:-3095}:80"
    depends_on:
      platform-admin-backend:
        condition: service_healthy
      platform-admin-frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  platform_admin_data:
