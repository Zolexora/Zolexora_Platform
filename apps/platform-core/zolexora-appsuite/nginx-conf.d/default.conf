# ==============================================================================
# Zolexora AppSuite — Production Nginx Gateway & Reverse Proxy
#
# Supported Environments:
#   1. Local Dev / Docker Compose: http://localhost:3070 (or path /api, /team, /)
#   2. VM Production (Single IP or Multi-Domain):
#      - app.yourdomain.com   -> Client Portal (Port 3000)
#      - team.yourdomain.com  -> DevTeam Console (Port 3000)
#      - api.yourdomain.com   -> Backend Express API (Port 8080)
#      - Unified / Gateway:
#        - /api/              -> Backend API
#        - /team/             -> DevTeam Console
#        - /                  -> Client Portal
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream appsuite_backend {
    server backend:8080;
    keepalive 32;
}

upstream appsuite_client {
    server client:3000;
    keepalive 32;
}

upstream appsuite_devteam {
    server devteam:3000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. API Subdomain Server Block
#    Handles: api.localhost, api.appsuite.local, api.*
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.localhost ~^api\..+$;

    client_max_body_size 50M;

    # Gateway Health Probe
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # ACME Challenge for Certbot (VM Production)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://appsuite_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 2. DevTeam Console Subdomain Server Block
#    Handles: team.localhost, devteam.localhost, team.*, devteam.*
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name team.localhost devteam.localhost ~^(team|devteam)\..+$;

    client_max_body_size 25M;

    # Gateway Health Probe
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # ACME Challenge for Certbot (VM Production)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Next.js Static Cache
    location /_next/static/ {
        proxy_pass http://appsuite_devteam/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    location / {
        proxy_pass http://appsuite_devteam;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ------------------------------------------------------------------------------
# 3. Default Unified Gateway Server Block
#    Handles: localhost, 127.0.0.1, app.*, client.*, or server IP
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost 127.0.0.1 "";

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Direct Gateway Health Probe
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # ACME Challenge for Certbot (VM Production)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Backend API Health Route
    location = /health {
        proxy_pass http://appsuite_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API Endpoints
    location /api/ {
        proxy_pass http://appsuite_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Next.js Static Asset Caching (Client Portal)
    location /_next/static/ {
        proxy_pass http://appsuite_client/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    # DevTeam Console Subpath Routing Fallback
    location /team/ {
        proxy_pass http://appsuite_devteam/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Client Portal (Default Route)
    location / {
        proxy_pass http://appsuite_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
