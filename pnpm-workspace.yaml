packages:
  - 'apps/core-platform/*'
  - 'apps/standalone-apps/*'
  - 'apps/core-platform/*/apps/*'
  - 'apps/standalone-apps/*/apps/*'
  - 'apps/core-platform/*/packages/*'
  - 'apps/standalone-apps/*/packages/*'
  - 'apps/core-platform/*/services/*'
  - 'apps/standalone-apps/*/services/*'
  - 'apps/core-platform/zolexora-shop/apps/*/*'
  - 'apps/core-platform/zolexora-shop/packages/*'
  - 'apps/core-platform/zolexora-ims/apps/*/frontend'
  - 'packages/*'
  - 'apps/*'
  - 'apps/*/*'
allowBuilds:
  '@nestjs/core': true
  better-sqlite3: true
  esbuild: true
  node-gyp: true
  unrs-resolver: true
  workerd: true


overrides:
  react: 19.1.0
  react-dom: 19.1.0
  uuid: ^11.1.1

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.21
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  vite: ^7.3.2
  zod: ^3.25.76
