packages:
  - 'apps/platform-core/*'
  - 'apps/platform-apps/*'
  - 'apps/platform-core/*/apps/*'
  - 'apps/platform-apps/*/apps/*'
  - 'apps/platform-core/*/packages/*'
  - 'apps/platform-apps/*/packages/*'
  - 'apps/platform-core/*/services/*'
  - 'apps/platform-apps/*/services/*'
  - 'apps/platform-apps/marketplace/apps/*/*'
  - 'apps/platform-apps/marketplace/packages/*'
  - 'apps/platform-core/zolexora-ims/apps/*/frontend'
  - 'packages/*'
  - 'apps/*'
  - 'apps/*/*'
allowBuilds:
  '@firebase/util': false
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  better-sqlite3: true
  core-js: false
  core-js-pure: false
  esbuild: true
  msgpackr-extract: true
  node-gyp: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true


overrides:
  react: 19.1.0
  react-dom: 19.1.0
  uuid: ^11.1.1

catalog:
  '@replit/vite-plugin-cartographer': ^0.6.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.3.5
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.3.2
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  vite: ^7.3.2
  zod: ^3.25.76
