name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME explicitly}

x-zolexora-contract:
  contract_version: "1"
  application_id: marketplace
  deployment_enabled: false
  production_ready: false
  image_reference_format: repository/image@sha256:<64-lowercase-hex-digest>
  confirmed_services: []
  unresolved_inputs:
    - service_roles
    - service_image_variables
    - internal_service_ports
    - image_owned_health_commands
    - migration_command
    - stateful_service_placement
    - persistent_volume_requirements
    - runtime_configuration_keys
    - secret_file_keys
    - resource_limits
    - edge_handoff
  long_running_service_policy:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    privileged: false
    read_only: true
    init: true
    restart: unless-stopped
    public_ports: forbidden
    host_network: forbidden
    source_mounts: forbidden
    secret_delivery: read-only-files
    healthcheck: image-owned-exec-form-required
    logging_driver: local
    pids_limit: required
    resource_limits: required
  migration_policy:
    restart: "no"
    public_ports: forbidden
    same_immutable_api_image: required-if-migrations-are-api-owned
    concurrency: one-runner-per-release
    successful_completion_required_before_promotion: true
    automatic_schema_rollback: false

# DP-09 deliberately defines no services until the application-owned role,
# port, health, migration, storage, and configuration contracts are supplied.
services: {}

networks:
  edge: {}
  application:
    internal: true
  data:
    internal: true

volumes: {}
secrets: {}
