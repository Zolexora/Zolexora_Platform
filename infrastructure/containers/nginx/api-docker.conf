events { worker_connections 2048; }
http {
    upstream api_backend { least_conn; server api:8000; keepalive 32; }
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:20m  rate=200r/s;
    server {
        listen 80; client_max_body_size 110M;
        gzip on; gzip_types application/json text/plain;

        location ~ ^/api/auth/(login|register|resend-otp|verify-register|forgot-password|reset-password)$ {
            limit_req zone=auth burst=20 nodelay; limit_req_status 429;
            proxy_pass http://api_backend; proxy_http_version 1.1;
            proxy_set_header Connection ""; proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/ {
            limit_req zone=api burst=100 nodelay; limit_req_status 429;
            proxy_pass http://api_backend; proxy_http_version 1.1;
            proxy_set_header Connection ""; proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location = /api/health { proxy_pass http://api_backend; access_log off; }
    }
}
