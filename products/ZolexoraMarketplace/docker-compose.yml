name: zolexora

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: ./services/marketplace-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./services/marketplace-api/.env.local
        required: false
      - path: ./services/marketplace-api/.env
        required: false
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DB_NAME: zolexora_db
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-me}
      AUTH_OTP_PEPPER: ${AUTH_OTP_PEPPER:-docker-dev-otp-pepper-change-me}
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CORS_ORIGINS: https://shop.zolexora.com,https://mahilamadel.store,https://www.mahilamadel.store,https://seller.zolexora.com,https://admin.marketplace.zolexora.com,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3003
      BUYER_URL: http://localhost:3000
      SELLER_URL: http://localhost:3001
      ADMIN_URL: http://localhost:3002

    ports:
      - "8000:8000"
    volumes:
      - backend-uploads:/app/uploads

  web-buyer:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    command: pnpm --filter @zolexora/storefront-zolexora-shop dev
    restart: unless-stopped
    tty: true
    stdin_open: true
    env_file:
      - path: ./apps/storefronts/zolexora-shop/web/.env.local
        required: false
    environment:
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - api
    ports:
      - "3000:3000"

  web-seller:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    command: pnpm --filter @zolexora/seller-portal dev
    restart: unless-stopped
    tty: true
    stdin_open: true
    env_file:
      - path: ./apps/portals/seller/web/.env.local
        required: false
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - api
    ports:
      - "3001:3001"

  web-admin:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    command: pnpm --filter @zolexora/marketplace-admin dev
    restart: unless-stopped
    tty: true
    stdin_open: true
    env_file:
      - path: ./apps/portals/marketplace-admin/web/.env.local
        required: false
    environment:
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - api
    ports:
      - "3002:3002"

  web-mahila:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    command: pnpm dev:mahila
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      PORT: "3003"
      BROWSER: "none"
      WDS_SOCKET_PORT: "0"
      REACT_APP_API_URL: http://localhost:8000/api
      REACT_APP_STOREFRONT_KEY: mahila-madel
    depends_on:
      - api
    ports:
      - "3003:3003"

  zolexora-mobile:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    command: pnpm dev:zolexora-mobile
    restart: unless-stopped
    environment:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: http://localhost:8000/api
      EXPO_PUBLIC_STOREFRONT_KEY: zolexora-shop
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: your-google-client-id.apps.googleusercontent.com
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"


  seller-mobile:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    command: pnpm dev:seller-mobile
    restart: unless-stopped
    environment:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: http://localhost:8000/api
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: your-google-client-id.apps.googleusercontent.com
    ports:
      - "8082:8082"
      - "19003:19000"
      - "19004:19001"
      - "19005:19002"

  mahila-mobile:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    command: pnpm dev:mahila-mobile
    restart: unless-stopped
    environment:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: http://localhost:8000/api
      EXPO_PUBLIC_STOREFRONT_KEY: mahila-madel
    ports:
      - "8083:8083"
      - "19006:19000"
      - "19007:19001"
      - "19008:19002"

volumes:
  redis-data:
  backend-uploads:
