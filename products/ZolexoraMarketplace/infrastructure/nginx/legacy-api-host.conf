# VPS / bare-metal load balancer
upstream zolexora_api {
    least_conn;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8003 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8004 max_fails=3 fail_timeout=30s;
    keepalive 64;
}
limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:20m    rate=200r/s;

server { listen 80; server_name api.zolexora.com; return 301 https://$host$request_uri; }

server {
    listen 443 ssl http2; server_name api.zolexora.com;
    ssl_certificate     /etc/letsencrypt/live/api.zolexora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zolexora.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 110M;
    proxy_connect_timeout 10s; proxy_send_timeout 60s; proxy_read_timeout 60s;
    gzip on; gzip_types application/json text/plain;

    location ~ ^/api/auth/(login|register|resend-otp|verify-register|forgot-password|reset-password)$ {
        limit_req zone=auth burst=20 nodelay; limit_req_status 429;
        proxy_pass http://zolexora_api; proxy_http_version 1.1;
        proxy_set_header Connection ""; proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        limit_req zone=api burst=100 nodelay; limit_req_status 429;
        proxy_pass http://zolexora_api; proxy_http_version 1.1;
        proxy_set_header Connection ""; proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/health { proxy_pass http://zolexora_api; access_log off; }
    location ~* \.(php|asp|aspx|jsp)$ { return 404; }
}
