# 1. TMS Web Frontend (Default Server)
server {
    listen 80 default_server;
    server_name app.localhost localhost 127.0.0.1 "";

    location / {
        proxy_pass http://tms-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. TMS Admin Dashboard
server {
    listen 80;
    server_name admin.localhost;

    location / {
        proxy_pass http://tms-admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. TMS Backend API (FastAPI)
server {
    listen 80;
    server_name api.localhost;

    location / {
        proxy_pass http://tms-backend:4030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
