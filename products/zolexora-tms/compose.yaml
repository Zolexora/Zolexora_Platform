services:
  backend:
    image: ${TMS_BACKEND_IMAGE:-ghcr.io/zolexora/tms-backend:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: products/zolexora-tms/apps/backend/Dockerfile
    container_name: tms-backend
    ports:
    - "${TMS_BACKEND_PORT:-4031}:4030"
    environment:
      - DATABASE_ZOLEXORA_TMS_HOST
      - DATABASE_ZOLEXORA_TMS_PORT
      - DATABASE_ZOLEXORA_TMS_NAME
      - DATABASE_ZOLEXORA_TMS_USER
      - DATABASE_ZOLEXORA_TMS_PASSWORD
      - DATABASE_ZOLEXORA_TMS_EXTERNAL_DATABASE_URL
      - DATABASE_ZOLEXORA_TMS_INTERNAL_DATABASE_URL
      - DATABASE_URL
      # All values below are injected by Infisical (scripts/with-secrets.sh); nothing is hardcoded.
      # NODE_ENV unset => backend runs in production mode (strict auth, no /docs).
      - NODE_ENV
      - FIREBASE_PROJECT_ID
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID
      - FIREBASE_ALLOWED_PROJECTS
      - PLATFORM_ADMIN_EMAILS
      - CORS_ORIGINS
      - OPERATIONS_TIMEZONE
      - REDIS_URL
      - REDIS_HOST
      - REDIS_PORT
      - REDIS_PASSWORD
      - REDIS_DB
      - REDIS_USE_SSL
      - SENTRY_DSN
      - RESEND_API_KEY
      - CASHFREE_APP_ID
      - CASHFREE_SECRET_KEY
      - CASHFREE_ENV
      - CLOUDFLARE_ACCOUNT_ID
      - CLOUDFLARE_API_TOKEN
      - CLOUDFLARE_R2_ACCESS_KEY
      - CLOUDFLARE_R2_SECRET_KEY
      - CLOUDFLARE_R2_BUCKET
      - R2_ENDPOINT_URL
      - R2_PUBLIC_BASE_URL
      - STORAGE_ACCESS_KEY_ID
      - STORAGE_SECRET_ACCESS_KEY
      - STORAGE_BUCKET
      - STORAGE_ENDPOINT_URL
      - STORAGE_PUBLIC_URL_PREFIX
      - CLOUDINARY_URL
      - CLOUDINARY_CLOUD_NAME
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:4030/health')
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  tms-web:
    image: ${TMS_WEB_IMAGE:-ghcr.io/zolexora/tms-web:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: products/zolexora-tms/Dockerfile.web
      args:
        APP_PATH: apps/tms-web
    container_name: tms-web
    volumes:
      - ./docker-entrypoint-env.sh:/docker-entrypoint.d/40-env-config.sh:ro
    environment:
      - NEXT_PUBLIC_TMS_CLIENT_FIREBASE_API_KEY
      - NEXT_PUBLIC_TMS_CLIENT_FIREBASE_AUTH_DOMAIN
      - NEXT_PUBLIC_TMS_CLIENT_FIREBASE_PROJECT_ID
      - NEXT_PUBLIC_TMS_CLIENT_FIREBASE_STORAGE_BUCKET
      - NEXT_PUBLIC_TMS_CLIENT_FIREBASE_MESSAGING_SENDER_ID
      - NEXT_PUBLIC_TMS_CLIENT_FIREBASE_APP_ID
      - NEXT_PUBLIC_TMS_CLIENT_PORTAL_URL
      - NEXT_PUBLIC_TMS_ADMIN_PORTAL_URL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/
      interval: 30s
      timeout: 10s
      retries: 3
  tms-admin:
    image: ${TMS_ADMIN_IMAGE:-ghcr.io/zolexora/tms-admin:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: products/zolexora-tms/Dockerfile.web
      args:
        APP_PATH: apps/tms-admin
    container_name: tms-admin
    volumes:
      - ./docker-entrypoint-env.sh:/docker-entrypoint.d/40-env-config.sh:ro
    environment:
      - NEXT_PUBLIC_TMS_ADMIN_FIREBASE_API_KEY
      - NEXT_PUBLIC_TMS_ADMIN_FIREBASE_AUTH_DOMAIN
      - NEXT_PUBLIC_TMS_ADMIN_FIREBASE_PROJECT_ID
      - NEXT_PUBLIC_TMS_ADMIN_FIREBASE_STORAGE_BUCKET
      - NEXT_PUBLIC_TMS_ADMIN_FIREBASE_MESSAGING_SENDER_ID
      - NEXT_PUBLIC_TMS_ADMIN_FIREBASE_APP_ID
      - NEXT_PUBLIC_TMS_CLIENT_PORTAL_URL
      - NEXT_PUBLIC_TMS_ADMIN_PORTAL_URL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/
      interval: 30s
      timeout: 10s
      retries: 3
  nginx:
    image: ${TMS_NGINX_IMAGE:-ghcr.io/zolexora/tms-nginx:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: products/zolexora-tms/Dockerfile.nginx
    container_name: tms-nginx
    ports:
    - "${TMS_PORT:-3090}:80"
    depends_on:
      backend:
        condition: service_healthy
      tms-web:
        condition: service_healthy
      tms-admin:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
