services:
  postgres:
    image: postgres:15-alpine
    container_name: tms-postgres
    environment:
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tms
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - "5432:5432"
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U tms -d tms
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: tms-backend
    environment:
    - DATABASE_URL=postgresql://tms:password@postgres:5432/tms
    - FIREBASE_PROJECT_ID=zolexora-platform
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:4030/health')
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  tms-web:
    build:
      context: ./
      dockerfile: Dockerfile.web
      args:
        APP_PATH: apps/frontend/zolexora-tms
    container_name: tms-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/
      interval: 30s
      timeout: 10s
      retries: 3
  tms-admin:
    build:
      context: ./
      dockerfile: Dockerfile.web
      args:
        APP_PATH: apps/frontend/tms-admin
    container_name: tms-admin
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/
      interval: 30s
      timeout: 10s
      retries: 3
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: tms-nginx
    ports:
    - "3074:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
volumes:
  postgres_data: null
