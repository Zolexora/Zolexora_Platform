services:
  backend:
    image: ${TMS_BACKEND_IMAGE:-ghcr.io/zolexora/zolexora-tms-backend:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: products/zolexora-tms/services/backend/Dockerfile
    container_name: tms-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
    - "${TMS_BACKEND_PORT:-4031}:4030"
    environment:
      - DATABASE_ZOLEXORA_TMS_HOST=${DATABASE_ZOLEXORA_TMS_HOST:?DATABASE_ZOLEXORA_TMS_HOST missing - run via scripts/setup/with-infisical.sh}
      - DATABASE_ZOLEXORA_TMS_PORT=${DATABASE_ZOLEXORA_TMS_PORT:?DATABASE_ZOLEXORA_TMS_PORT missing - run via scripts/setup/with-infisical.sh}
      - DATABASE_ZOLEXORA_TMS_NAME=${DATABASE_ZOLEXORA_TMS_NAME:?DATABASE_ZOLEXORA_TMS_NAME missing - run via scripts/setup/with-infisical.sh}
      - DATABASE_ZOLEXORA_TMS_USER=${DATABASE_ZOLEXORA_TMS_USER:?DATABASE_ZOLEXORA_TMS_USER missing - run via scripts/setup/with-infisical.sh}
      - DATABASE_ZOLEXORA_TMS_PASSWORD=${DATABASE_ZOLEXORA_TMS_PASSWORD:?DATABASE_ZOLEXORA_TMS_PASSWORD missing - run via scripts/setup/with-infisical.sh}
      - DATABASE_ZOLEXORA_TMS_EXTERNAL_DATABASE_URL
      - DATABASE_ZOLEXORA_TMS_INTERNAL_DATABASE_URL
      - DATABASE_URL
      # All values come from Infisical (scripts/setup/with-infisical.sh); `${VAR:?}` ones are required and block startup.
      # NODE_ENV unset => backend runs in production mode (strict auth, no /docs).
      - NODE_ENV
      # Every token is verified by the Zolexora auth service; platform admins are its is_platform_admin users.
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:?AUTH_SERVICE_URL missing - run via scripts/setup/with-infisical.sh}
      - TMS_IN_DOCKER=1
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS missing - run via scripts/setup/with-infisical.sh}
      - OPERATIONS_TIMEZONE
      - REDIS_URL
      - REDIS_DATABASE_R1_HOST
      - REDIS_DATABASE_R1_PORT
      - REDIS_DATABASE_R1_USERNAME
      - REDIS_DATABASE_R1_PASSWORD
      - REDIS_DB
      - REDIS_USE_SSL
      - SENTRY_DSN
      - RESEND_API_KEY
      - CASHFREE_APP_ID
      - CASHFREE_SECRET_KEY
      - CASHFREE_ENV
      - CLOUDFLARE_ACCOUNT_ID
      - CLOUDFLARE_API_TOKEN
      - CLOUDFLARE_R2_ACCESS_KEY
      - CLOUDFLARE_R2_SECRET_KEY
      - CLOUDFLARE_R2_BUCKET
      - R2_ENDPOINT_URL
      - R2_PUBLIC_BASE_URL
      - STORAGE_ACCESS_KEY_ID
      - STORAGE_SECRET_ACCESS_KEY
      - STORAGE_BUCKET
      - STORAGE_ENDPOINT_URL
      - STORAGE_PUBLIC_URL_PREFIX
      - CLOUDINARY_URL
      - CLOUDINARY_CLOUD_NAME
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:4030/health')
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  tms-web:
    image: ${TMS_WEB_IMAGE:-ghcr.io/zolexora/zolexora-tms-web:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: products/zolexora-tms/Dockerfile.web
      args:
        APP_PATH: apps/tms-web
    container_name: tms-web
    volumes:
      - ./docker-entrypoint-env.sh:/docker-entrypoint.d/40-env-config.sh:ro
    environment:
      # Sign-in goes through the Zolexora auth service; values come from Infisical.
      - AUTH_SERVICE_PUBLIC_URL=${AUTH_SERVICE_PUBLIC_URL:?AUTH_SERVICE_PUBLIC_URL missing - run via scripts/setup/with-infisical.sh}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY missing - run via scripts/setup/with-infisical.sh}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/
      interval: 30s
      timeout: 10s
      retries: 3
  tms-admin:
    image: ${TMS_ADMIN_IMAGE:-ghcr.io/zolexora/zolexora-tms-admin:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: products/zolexora-tms/Dockerfile.web
      args:
        APP_PATH: apps/tms-admin
    container_name: tms-admin
    volumes:
      - ./docker-entrypoint-env.sh:/docker-entrypoint.d/40-env-config.sh:ro
    environment:
      # Sign-in goes through the Zolexora auth service; values come from Infisical.
      - AUTH_SERVICE_PUBLIC_URL=${AUTH_SERVICE_PUBLIC_URL:?AUTH_SERVICE_PUBLIC_URL missing - run via scripts/setup/with-infisical.sh}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY missing - run via scripts/setup/with-infisical.sh}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/
      interval: 30s
      timeout: 10s
      retries: 3
  nginx:
    image: ${TMS_NGINX_IMAGE:-ghcr.io/zolexora/zolexora-tms-nginx:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: products/zolexora-tms/Dockerfile.nginx
    container_name: tms-nginx
    ports:
    - "${TMS_PORT:-3090}:80"
    depends_on:
      backend:
        condition: service_healthy
      tms-web:
        condition: service_healthy
      tms-admin:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
