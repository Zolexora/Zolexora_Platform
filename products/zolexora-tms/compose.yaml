services:
  backend:
    image: ${TMS_BACKEND_IMAGE:-ghcr.io/zolexora/tms-backend:latest}
    pull_policy: missing
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: tms-backend
    ports:
    - "${TMS_BACKEND_PORT:-4031}:4030"
    environment:
      - DATABASE_ZOLEXORA_TMS_HOST
      - DATABASE_ZOLEXORA_TMS_PORT
      - DATABASE_ZOLEXORA_TMS_NAME
      - DATABASE_ZOLEXORA_TMS_USER
      - DATABASE_ZOLEXORA_TMS_PASSWORD
      - DATABASE_ZOLEXORA_TMS_EXTERNAL_DATABASE_URL
      - DATABASE_ZOLEXORA_TMS_INTERNAL_DATABASE_URL
      - DATABASE_URL
      - FIREBASE_PROJECT_ID=zolexora-platform
      - PATH=/app/.venv/bin:/usr/local/bin:/usr/bin:/bin
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:4030/health')
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  tms-web:
    image: ${TMS_WEB_IMAGE:-ghcr.io/zolexora/tms-web:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: products/zolexora-tms/Dockerfile.web
      args:
        APP_PATH: apps/tms-web
    container_name: tms-web
    volumes:
      - ./docker-entrypoint-env.sh:/docker-entrypoint.d/40-env-config.sh:ro
    environment:
      - NEXT_PUBLIC_TMS_CLIENT_FIREBASE_API_KEY
      - NEXT_PUBLIC_TMS_CLIENT_FIREBASE_AUTH_DOMAIN
      - NEXT_PUBLIC_TMS_CLIENT_FIREBASE_PROJECT_ID
      - NEXT_PUBLIC_TMS_CLIENT_FIREBASE_STORAGE_BUCKET
      - NEXT_PUBLIC_TMS_CLIENT_FIREBASE_MESSAGING_SENDER_ID
      - NEXT_PUBLIC_TMS_CLIENT_FIREBASE_APP_ID
      - NEXT_PUBLIC_TMS_CLIENT_PORTAL_URL
      - NEXT_PUBLIC_TMS_ADMIN_PORTAL_URL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/
      interval: 30s
      timeout: 10s
      retries: 3
  tms-admin:
    image: ${TMS_ADMIN_IMAGE:-ghcr.io/zolexora/tms-admin:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: products/zolexora-tms/Dockerfile.web
      args:
        APP_PATH: apps/tms-admin
    container_name: tms-admin
    volumes:
      - ./docker-entrypoint-env.sh:/docker-entrypoint.d/40-env-config.sh:ro
    environment:
      - NEXT_PUBLIC_TMS_ADMIN_FIREBASE_API_KEY
      - NEXT_PUBLIC_TMS_ADMIN_FIREBASE_AUTH_DOMAIN
      - NEXT_PUBLIC_TMS_ADMIN_FIREBASE_PROJECT_ID
      - NEXT_PUBLIC_TMS_ADMIN_FIREBASE_STORAGE_BUCKET
      - NEXT_PUBLIC_TMS_ADMIN_FIREBASE_MESSAGING_SENDER_ID
      - NEXT_PUBLIC_TMS_ADMIN_FIREBASE_APP_ID
      - NEXT_PUBLIC_TMS_CLIENT_PORTAL_URL
      - NEXT_PUBLIC_TMS_ADMIN_PORTAL_URL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/
      interval: 30s
      timeout: 10s
      retries: 3
  nginx:
    image: ${TMS_NGINX_IMAGE:-ghcr.io/zolexora/tms-nginx:latest}
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: tms-nginx
    ports:
    - "${TMS_PORT:-3090}:80"
    depends_on:
      backend:
        condition: service_healthy
      tms-web:
        condition: service_healthy
      tms-admin:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
