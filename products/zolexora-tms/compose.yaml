services:
  postgres:
    image: postgres:15-alpine
    container_name: tms-postgres
    environment:
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tms -d tms"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: tms-backend
    environment:
      - DATABASE_URL=postgresql://tms:password@postgres:5432/tms
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  tms-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_PATH: apps/frontend/zolexora-tms
    container_name: tms-web

  tms-admin:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_PATH: apps/frontend/tms-admin
    container_name: tms-admin

  nginx:
    image: nginx:alpine
    container_name: tms-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
