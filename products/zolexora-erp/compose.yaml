services:
  mariadb:
    image: mariadb:10.11
    container_name: erp-mariadb
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-erpnext}
      MYSQL_USER: ${MYSQL_USER:-erpnext}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin}
    volumes:
    - db_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - mariadb-admin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD:-admin}
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  redis-cache:
    image: redis:7-alpine
    container_name: erp-redis-cache
    command:
    - redis-server
    - --save
    - ''
    - --appendonly
    - 'no'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  redis-queue:
    image: redis:7-alpine
    container_name: erp-redis-queue
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_queue:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  erp-web:
    build:
      context: ../..
      dockerfile: products/zolexora-erp/Dockerfile
    container_name: erp-web
    command: bench serve --port 8000
    environment:
      DB_HOST: mariadb
      DB_PORT: '3306'
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin}
      REDIS_CACHE: redis://redis-cache:6379
      REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://localhost:8000/api/method/ping || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  erp-worker:
    build:
      context: ../..
      dockerfile: products/zolexora-erp/Dockerfile
    container_name: erp-worker
    command: bench worker --queue short,default,long
    environment:
      DB_HOST: mariadb
      DB_PORT: '3306'
      REDIS_CACHE: redis://redis-cache:6379
      REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      erp-web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
  erp-scheduler:
    build:
      context: ../..
      dockerfile: products/zolexora-erp/Dockerfile
    container_name: erp-scheduler
    command: bench schedule
    environment:
      DB_HOST: mariadb
      DB_PORT: '3306'
      REDIS_CACHE: redis://redis-cache:6379
      REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      erp-web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
  erp-socketio:
    build:
      context: ../..
      dockerfile: products/zolexora-erp/Dockerfile
    container_name: erp-socketio
    command: bench socketio
    environment:
      REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      erp-web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
  nginx:
    image: nginx:alpine
    container_name: erp-nginx
    ports:
    - 80:80
    volumes:
    - ./nginx-conf.d:/etc/nginx/conf.d:ro
    depends_on:
      erp-web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  db_data: null
  redis_queue: null
