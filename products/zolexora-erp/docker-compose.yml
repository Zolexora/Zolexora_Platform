version: '3'
services:
  zolexora-erp-db:
    image: mariadb:10.6
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: admin
    volumes:
    - db-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5
  zolexora-erp-redis-cache:
    image: redis:6.2-alpine
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  zolexora-erp-redis-queue:
    image: redis:6.2-alpine
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  zolexora-erp-web:
    build: .
    command: bench serve --port 8000
    environment:
      DB_HOST: zolexora-erp-db
      DB_PORT: '3306'
      REDIS_CACHE: redis://zolexora-erp-redis-cache:6379
      REDIS_QUEUE: redis://zolexora-erp-redis-queue:6379
      MYSQL_ROOT_PASSWORD: admin
    ports:
    - 8000:8000
    depends_on:
    - zolexora-erp-db
    - zolexora-erp-redis-cache
    - zolexora-erp-redis-queue
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
  zolexora-erp-worker:
    build: .
    command: bench worker --queue short,default,long
    environment:
      DB_HOST: zolexora-erp-db
      DB_PORT: '3306'
      REDIS_CACHE: redis://zolexora-erp-redis-cache:6379
      REDIS_QUEUE: redis://zolexora-erp-redis-queue:6379
    depends_on:
    - zolexora-erp-db
    - zolexora-erp-redis-queue
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
  zolexora-erp-scheduler:
    build: .
    command: bench schedule
    environment:
      DB_HOST: zolexora-erp-db
      DB_PORT: '3306'
      REDIS_CACHE: redis://zolexora-erp-redis-cache:6379
      REDIS_QUEUE: redis://zolexora-erp-redis-queue:6379
    depends_on:
    - zolexora-erp-db
    - zolexora-erp-redis-queue
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  db-data: null
