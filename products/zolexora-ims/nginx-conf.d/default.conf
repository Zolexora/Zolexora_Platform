server {
    listen 80;
    server_name user-api.localhost;
    location / {
        proxy_pass http://ims-user-backend:4050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name app.localhost localhost;
    location / {
        proxy_pass http://ims-user-frontend:3000;
        proxy_set_header Host $host;
    }
}
