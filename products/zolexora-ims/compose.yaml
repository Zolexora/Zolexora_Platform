services:
  postgres:
    image: postgres:15-alpine
    container_name: ims-postgres
    environment:
      POSTGRES_USER: ims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ims
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ims -d ims
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  ims-admin-backend:
    image: ${IMS_ADMIN_BACKEND_IMAGE:-ghcr.io/zolexora/zolexora-ims-admin-backend:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: products/zolexora-ims/services/admin-api/Dockerfile
    container_name: ims-admin-backend
    environment:
    - DATABASE_URL=postgresql://ims:${POSTGRES_PASSWORD}@postgres:5432/ims
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4051/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  ims-user-backend:
    image: ${IMS_USER_BACKEND_IMAGE:-ghcr.io/zolexora/zolexora-ims-user-backend:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: products/zolexora-ims/services/user-api/Dockerfile
    container_name: ims-user-backend
    environment:
    - DATABASE_URL=postgresql://ims:${POSTGRES_PASSWORD}@postgres:5432/ims
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  ims-admin-frontend:
    image: ${IMS_ADMIN_FRONTEND_IMAGE:-ghcr.io/zolexora/zolexora-ims-admin-frontend:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: products/zolexora-ims/apps/ims-admin/frontend/Dockerfile
    container_name: ims-admin-frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
  ims-user-frontend:
    image: ${IMS_USER_FRONTEND_IMAGE:-ghcr.io/zolexora/zolexora-ims-user-frontend:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: products/zolexora-ims/apps/ims-user/frontend/Dockerfile
    container_name: ims-user-frontend
    environment:
    - AUTH_SERVICE_PUBLIC_URL=${AUTH_SERVICE_PUBLIC_URL:?AUTH_SERVICE_PUBLIC_URL missing - run via scripts/setup/with-infisical.sh}
    - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY missing - run via scripts/setup/with-infisical.sh}
    - NEXT_PUBLIC_IMS_CLIENT_FIREBASE_API_KEY=${NEXT_PUBLIC_IMS_CLIENT_FIREBASE_API_KEY:?NEXT_PUBLIC_IMS_CLIENT_FIREBASE_API_KEY missing - run via scripts/setup/with-infisical.sh}
    - NEXT_PUBLIC_IMS_CLIENT_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_IMS_CLIENT_FIREBASE_AUTH_DOMAIN:?NEXT_PUBLIC_IMS_CLIENT_FIREBASE_AUTH_DOMAIN missing - run via scripts/setup/with-infisical.sh}
    - NEXT_PUBLIC_IMS_CLIENT_FIREBASE_APP_ID=${NEXT_PUBLIC_IMS_CLIENT_FIREBASE_APP_ID:?NEXT_PUBLIC_IMS_CLIENT_FIREBASE_APP_ID missing - run via scripts/setup/with-infisical.sh}
    - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?NEXT_PUBLIC_FIREBASE_PROJECT_ID missing - run via scripts/setup/with-infisical.sh}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
  nginx:
    image: ${IMS_NGINX_IMAGE:-ghcr.io/zolexora/zolexora-ims-nginx:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: products/zolexora-ims/Dockerfile.nginx
    container_name: ims-nginx
    ports:
    - "3072:80"
    depends_on:
    - ims-admin-backend
    - ims-user-backend
    - ims-admin-frontend
    - ims-user-frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 -H \"Host: app.localhost\" http://127.0.0.1/ -o /dev/null && exit 0 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
volumes:
  postgres_data: null
