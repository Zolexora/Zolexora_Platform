services:
  postgres:
    image: postgres:15-alpine
    container_name: ims-postgres
    environment:
      POSTGRES_USER: ims
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ims
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ims -d ims
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  ims-admin-backend:
    build:
      context: ./apps/ims-admin/backend
      dockerfile: Dockerfile
    container_name: ims-admin-backend
    environment:
    - DATABASE_URL=postgresql://ims:password@postgres:5432/ims
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4051/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  ims-user-backend:
    build:
      context: ./apps/ims-user/backend
      dockerfile: Dockerfile
    container_name: ims-user-backend
    environment:
    - DATABASE_URL=postgresql://ims:password@postgres:5432/ims
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  ims-admin-frontend:
    build:
      context: ./apps/ims-admin/frontend
      dockerfile: Dockerfile
    container_name: ims-admin-frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
  ims-user-frontend:
    build:
      context: ./apps/ims-user/frontend
      dockerfile: Dockerfile
    container_name: ims-user-frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: ims-nginx
    ports:
    - "3072:80"
    depends_on:
    - ims-admin-backend
    - ims-user-backend
    - ims-admin-frontend
    - ims-user-frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 -H \"Host: app.localhost\" http://127.0.0.1/ -o /dev/null && exit 0 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
volumes:
  postgres_data: null
