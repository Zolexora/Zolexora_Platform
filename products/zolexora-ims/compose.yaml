services:
  postgres:
    image: postgres:15-alpine
    container_name: ims-postgres
    environment:
      POSTGRES_USER: ims
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ims
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ims -d ims"]
      interval: 5s
      timeout: 5s
      retries: 5

  ims-admin-backend:
    build:
      context: ./apps/ims-admin/backend
      dockerfile: Dockerfile
    container_name: ims-admin-backend
    environment:
      - DATABASE_URL=postgresql://ims:password@postgres:5432/ims
    depends_on:
      postgres:
        condition: service_healthy

  ims-user-backend:
    build:
      context: ./apps/ims-user/backend
      dockerfile: Dockerfile
    container_name: ims-user-backend
    environment:
      - DATABASE_URL=postgresql://ims:password@postgres:5432/ims
    depends_on:
      postgres:
        condition: service_healthy

  ims-admin-frontend:
    build:
      context: ./apps/ims-admin/frontend
      dockerfile: Dockerfile
    container_name: ims-admin-frontend

  ims-user-frontend:
    build:
      context: ./apps/ims-user/frontend
      dockerfile: Dockerfile
    container_name: ims-user-frontend

  nginx:
    image: nginx:alpine
    container_name: ims-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ims-admin-backend
      - ims-user-backend
      - ims-admin-frontend
      - ims-user-frontend

volumes:
  postgres_data:
