server {
    listen 80;
    server_name admin-api.localhost;
    location / {
        proxy_pass http://ims-admin-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name user-api.localhost;
    location / {
        proxy_pass http://ims-user-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name admin.localhost;
    location / {
        proxy_pass http://ims-admin-frontend:3001;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name app.localhost localhost;
    location / {
        proxy_pass http://ims-user-frontend:3000;
        proxy_set_header Host $host;
    }
}
