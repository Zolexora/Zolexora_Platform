services:
  api:
    build:
      context: ../../
      dockerfile: products/zolexora-engage/Dockerfile.api
    container_name: zolexora-engage-api
    environment:
    - NODE_ENV=production
    - PORT=3000
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
  web:
    build:
      context: ../../
      dockerfile: products/zolexora-engage/Dockerfile.web
    container_name: zolexora-engage-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: zolexora-engage-nginx
    ports:
    - "3077:80"
    depends_on:
    - api
    - web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
