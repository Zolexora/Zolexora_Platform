services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: zolexora-engage-api
    environment:
      - NODE_ENV=production
      - PORT=3000

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: zolexora-engage-web

  nginx:
    image: nginx:alpine
    container_name: zolexora-engage-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
