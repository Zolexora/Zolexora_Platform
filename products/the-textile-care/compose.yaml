services:
  postgres:
    image: postgres:15-alpine
    container_name: ttc-postgres
    environment:
      POSTGRES_USER: ttc
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ttc
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ttc -d ttc
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  redis:
    image: redis:7-alpine
    container_name: ttc-redis
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ttc-backend
    environment:
    - DATABASE_URL=postgresql+psycopg://ttc:password@postgres:5432/ttc
    - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:4010/health')
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  admin-web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.nextjs
      args:
        APP_PATH: apps/admin-web
    container_name: ttc-admin-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
  seller-web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.nextjs
      args:
        APP_PATH: apps/seller-web
    container_name: ttc-seller-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
  marketplace-web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.nextjs
      args:
        APP_PATH: apps/marketplace-web
    container_name: ttc-marketplace-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
  nginx:
    image: nginx:alpine
    container_name: ttc-nginx
    ports:
    - 80:80
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - backend
    - admin-web
    - seller-web
    - marketplace-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  postgres_data: null
