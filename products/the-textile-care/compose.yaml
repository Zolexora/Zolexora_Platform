services:
  postgres:
    image: postgres:15-alpine
    container_name: ttc-postgres
    environment:
      POSTGRES_USER: ttc
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ttc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttc -d ttc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ttc-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ttc-backend
    environment:
      - DATABASE_URL=postgresql+psycopg://ttc:password@postgres:5432/ttc
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4010/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Next.js web apps (3000 internally via next start)
  admin-web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.nextjs
      args:
        APP_PATH: apps/admin-web
    container_name: ttc-admin-web

  seller-web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.nextjs
      args:
        APP_PATH: apps/seller-web
    container_name: ttc-seller-web

  marketplace-web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.nextjs
      args:
        APP_PATH: apps/marketplace-web
    container_name: ttc-marketplace-web

  nginx:
    image: nginx:alpine
    container_name: ttc-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - admin-web
      - seller-web
      - marketplace-web

volumes:
  postgres_data:
