services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: maun-kavach-backend
    env_file: .env
    environment:
    - PORT=8080
    - NODE_ENV=production
    - SUPABASE_URL=${SUPABASE_URL}
    - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    - JWT_SECRET=${JWT_SECRET}
    - DATABASE_URL=${DATABASE_URL}
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8080/health
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: maun-kavach-web
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:80
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: maun-kavach-nginx
    ports:
    - 3071:80
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
