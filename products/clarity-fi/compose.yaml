services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: clarity-fi-backend
    environment:
    - PORT=8080
    - NODE_ENV=production
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8080/health
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: clarity-fi-web
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:80
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  nginx:
    image: nginx:alpine
    container_name: clarity-fi-nginx
    ports:
    - 80:80
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - backend
    - frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
