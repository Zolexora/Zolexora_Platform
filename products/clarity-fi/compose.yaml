services:
  backend:
    build:
      context: ../../
      dockerfile: products/clarity-fi/Dockerfile.api
    container_name: clarity-fi-backend
    environment:
    - PORT=8080
    - NODE_ENV=production
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8080/api/healthz
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  frontend:
    build:
      context: ./
      dockerfile: Dockerfile.web
    container_name: clarity-fi-web
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:80
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: clarity-fi-nginx
    ports:
    - "3075:80"
    depends_on:
    - backend
    - frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/
      interval: 30s
      timeout: 10s
      retries: 3
