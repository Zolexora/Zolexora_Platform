server {
    listen 80;
    server_name localhost;

    # API Backend Reverse Proxy
    location /api/ {
        proxy_pass http://backend:4060/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health Check
    location /health {
        proxy_pass http://backend:4060/health;
        proxy_set_header Host $host;
    }

    # API Documentation
    location /docs {
        proxy_pass http://backend:4060/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:4060/openapi.json;
        proxy_set_header Host $host;
    }

    # Default fallback
    location / {
        return 200 '{"status":"ONLINE","platform":"Zolexora Platform","app":"🏋️ Zolexora IronClub Smart Gym System","ports":{"adminWeb":3040,"managerWeb":3042,"marketingWeb":3043,"api":4060}}';
        add_header Content-Type application/json;
    }
}
