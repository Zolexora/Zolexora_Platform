services:
  backend:
    build:
      context: ../../
      dockerfile: products/clarityfi/Dockerfile.api
    container_name: clarity-fi-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - NODE_ENV=production
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/api/healthz
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  frontend:
    build:
      context: ../../
      dockerfile: products/clarityfi/Dockerfile.web
    container_name: clarity-fi-web
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:80/healthz
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  nginx:
    build:
      context: ../../
      dockerfile: products/clarityfi/Dockerfile.nginx
    container_name: clarity-fi-nginx
    restart: unless-stopped
    ports:
      - "${CLARITYFI_PORT:-3110}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - -H
        - "Host: localhost"
        - http://127.0.0.1:80/healthz
      interval: 15s
      timeout: 5s
      retries: 3
