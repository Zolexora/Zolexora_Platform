services:
  mongo:
    image: mongo:6
    container_name: marketplace-mongo
    volumes:
    - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:15-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_USER: zolexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - run via scripts/setup/with-infisical.sh}
      POSTGRES_DB: marketplace
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U zolexora -d marketplace
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  backend:
    image: ${MARKETPLACE_BACKEND_IMAGE:-ghcr.io/zolexora/zolexora-marketplace-backend:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: infrastructure/containers/docker/Dockerfile.api-python
      args:
        APP_DIR: products/zolexora-marketplace/services/marketplace-api
    container_name: marketplace-backend
    environment:
    # All values come from Infisical (scripts/setup/with-infisical.sh); `${VAR:?}` ones block startup.
    - APP_ENV=${APP_ENV:?APP_ENV missing - run via scripts/setup/with-infisical.sh}
    - DATABASE_URL=postgresql://zolexora:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - run via scripts/setup/with-infisical.sh}@postgres:5432/marketplace
    - MONGO_URL=mongodb://mongo:27017/marketplace
    - REDIS_URL=redis://redis:6379/0
    # Every token is checked by the Zolexora auth service; admins are its platform admins.
    - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:?AUTH_SERVICE_URL missing - run via scripts/setup/with-infisical.sh}
    - MARKETPLACE_IN_DOCKER=1
    - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS missing - run via scripts/setup/with-infisical.sh}
    - TRUSTED_PROXIES
    - CLOUDINARY_CLOUD_NAME
    - CLOUDINARY_API_KEY
    - CLOUDINARY_API_SECRET
    - RAZORPAY_KEY_ID
    - RAZORPAY_KEY_SECRET
    - RAZORPAY_WEBHOOK_SECRET
    - CASHFREE_ENVIRONMENT
    - CASHFREE_CLIENT_ID
    - CASHFREE_CLIENT_SECRET
    - SHIPPING_WEBHOOK_SECRET
    - ERP_WEBHOOK_SECRET
    - UPI_ID
    - SENTRY_DSN
    extra_hosts:
    - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  admin-web:
    image: ${MARKETPLACE_ADMIN_WEB_IMAGE:-ghcr.io/zolexora/zolexora-marketplace-admin-web:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: infrastructure/containers/docker/Dockerfile.nextjs
      args:
        APP_NAME: "@zolexora/marketplace-admin"
        APP_DIR: products/zolexora-marketplace/apps/portals/marketplace-admin/web
    container_name: marketplace-admin-web
    # Public, browser-safe config from Infisical, read at runtime (never baked into the image).
    environment: &web-env
      MARKETPLACE_API_URL: ${MARKETPLACE_API_URL:?MARKETPLACE_API_URL missing - run via scripts/setup/with-infisical.sh}
      AUTH_SERVICE_PUBLIC_URL: ${AUTH_SERVICE_PUBLIC_URL:?AUTH_SERVICE_PUBLIC_URL missing - run via scripts/setup/with-infisical.sh}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY missing - run via scripts/setup/with-infisical.sh}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:?FIREBASE_WEB_API_KEY missing - run via scripts/setup/with-infisical.sh}
      FIREBASE_WEB_AUTH_DOMAIN: ${FIREBASE_WEB_AUTH_DOMAIN:?FIREBASE_WEB_AUTH_DOMAIN missing - run via scripts/setup/with-infisical.sh}
      FIREBASE_WEB_PROJECT_ID: ${FIREBASE_WEB_PROJECT_ID:?FIREBASE_WEB_PROJECT_ID missing - run via scripts/setup/with-infisical.sh}
      FIREBASE_WEB_APP_ID: ${FIREBASE_WEB_APP_ID:?FIREBASE_WEB_APP_ID missing - run via scripts/setup/with-infisical.sh}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  seller-web:
    image: ${MARKETPLACE_SELLER_WEB_IMAGE:-ghcr.io/zolexora/zolexora-marketplace-seller-web:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: infrastructure/containers/docker/Dockerfile.nextjs
      args:
        APP_NAME: "@zolexora/marketplace-seller-web"
        APP_DIR: products/zolexora-marketplace/apps/portals/seller/web
    container_name: marketplace-seller-web
    environment: *web-env
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  shop-web:
    image: ${MARKETPLACE_SHOP_WEB_IMAGE:-ghcr.io/zolexora/zolexora-marketplace-shop-web:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: infrastructure/containers/docker/Dockerfile.nextjs
      args:
        APP_NAME: "@zolexora/marketplace-shop-web"
        APP_DIR: products/zolexora-marketplace/apps/storefronts/zolexora-shop/web
    container_name: marketplace-shop-web
    environment: *web-env
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  mahila-web:
    image: ${MARKETPLACE_MAHILA_WEB_IMAGE:-ghcr.io/zolexora/zolexora-marketplace-mahila-web:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: infrastructure/containers/docker/Dockerfile.cra
      args:
        APP_NAME: "@zolexora/marketplace-mahila-madel-web"
        APP_DIR: products/zolexora-marketplace/apps/storefronts/mahila-madel/web
    container_name: marketplace-mahila-web
    environment: *web-env
    volumes:
    # Writes /env-config.js from the environment when nginx starts.
    - ./scripts/web-env-config.sh:/docker-entrypoint.d/40-env-config.sh:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  nginx:
    image: ${MARKETPLACE_NGINX_IMAGE:-ghcr.io/zolexora/zolexora-marketplace-nginx:latest}
    pull_policy: missing
    build:
      context: ../../
      dockerfile: products/zolexora-marketplace/Dockerfile.nginx
    container_name: marketplace-nginx
    ports:
    - "3079:80"
    depends_on:
    - backend
    - admin-web
    - seller-web
    - shop-web
    - mahila-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M


volumes:
  postgres_data:
  mongo_data:
