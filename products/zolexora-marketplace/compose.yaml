services:
  mongo:
    image: mongo:6
    container_name: marketplace-mongo
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:15-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_USER: zolexora
      POSTGRES_PASSWORD: password
      POSTGRES_DB: marketplace
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U zolexora -d marketplace
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  backend:
    build:
      context: ./services/marketplace-api
      dockerfile: ../../../../infrastructure/containers/docker/Dockerfile.api-python
    container_name: marketplace-backend
    environment:
    - DATABASE_URL=postgresql://zolexora:password@postgres:5432/marketplace
    - MONGO_URL=mongodb://mongo:27017/marketplace
    - AUTH_OTP_PEPPER=dummy_pepper
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  admin-web:
    build:
      context: ../../
      dockerfile: infrastructure/containers/docker/Dockerfile.nextjs
      args:
        APP_NAME: "@zolexora/marketplace-admin"
        APP_DIR: products/zolexora-marketplace/apps/portals/marketplace-admin/web
    container_name: marketplace-admin-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  seller-web:
    build:
      context: ../../
      dockerfile: infrastructure/containers/docker/Dockerfile.nextjs
      args:
        APP_NAME: "@zolexora/seller-portal"
        APP_DIR: products/zolexora-marketplace/apps/portals/seller/web
    container_name: marketplace-seller-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  shop-web:
    build:
      context: ../../
      dockerfile: infrastructure/containers/docker/Dockerfile.nextjs
      args:
        APP_NAME: "@zolexora/storefront-zolexora-shop"
        APP_DIR: products/zolexora-marketplace/apps/storefronts/zolexora-shop/web
    container_name: marketplace-shop-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  mahila-web:
    build:
      context: ../../
      dockerfile: infrastructure/containers/docker/Dockerfile.cra
      args:
        APP_NAME: "@zolexora/storefront-mahila-madel"
        APP_DIR: products/zolexora-marketplace/apps/storefronts/mahila-madel/web
    container_name: marketplace-mahila-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: marketplace-nginx
    ports:
    - "3079:80"
    depends_on:
    - backend
    - admin-web
    - seller-web
    - shop-web
    - mahila-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M


volumes:
  postgres_data:
