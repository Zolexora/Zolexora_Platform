services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    image: ${AI_BACKEND_IMAGE:-ghcr.io/zolexora/zolexora-ai-backend:latest}
    pull_policy: missing
    ports:
    - 4090:4090
    environment:
    - PYTHONUNBUFFERED=1
    - LLM_PROVIDER
    - AZURE_OPENAI_API_VERSION
    - AZURE_OPENAI_DEPLOYMENT
    - AZURE_OPENAI_DEPLOYMENT_GPT4O
    - AZURE_OPENAI_DEPLOYMENT_PHI4
    - AZURE_OPENAI_DEPLOYMENT_MINI
    - FALLBACK_MODEL_PRIMARY
    - FALLBACK_MODEL_SECONDARY
    - FALLBACK_MODEL_TERTIARY
    - AZURE_SEARCH_ENDPOINT
    - AZURE_SEARCH_API_KEY
    - AZURE_SEARCH_INDEX_NAME
    - AZURE_SUBSCRIPTION_ID
    - AZURE_RESOURCE_GROUP
    - AZURE_CONTAINER_REGISTRY
    - AZURE_CONTAINER_APP_ENV
    - GITHUB_TOKEN
    - GITHUB_ORG
    - BING_SEARCH_API_KEY
    - APP_ENV
    - LOG_LEVEL
    - MAX_CONCURRENT_JOBS
    - JOB_TIMEOUT_SECONDS
    - SESSION_STORE_PATH
    - RATE_LIMIT_REQUESTS
    - RATE_LIMIT_WINDOW_SECONDS
    - PYTHONPATH=/app/backend
    - REDIS_URL=redis://redis:6379/0
    - API_KEY=${API_KEY}
    - AZURE_OPENAI_ENDPOINT
    - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
    - SECRET_KEY=${SECRET_KEY}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  celery:
    image: ${AI_BACKEND_IMAGE:-ghcr.io/zolexora/zolexora-ai-backend:latest}
    pull_policy: missing
    environment:
    - PYTHONUNBUFFERED=1
    - LLM_PROVIDER
    - AZURE_OPENAI_API_VERSION
    - AZURE_OPENAI_DEPLOYMENT
    - AZURE_OPENAI_DEPLOYMENT_GPT4O
    - AZURE_OPENAI_DEPLOYMENT_PHI4
    - AZURE_OPENAI_DEPLOYMENT_MINI
    - FALLBACK_MODEL_PRIMARY
    - FALLBACK_MODEL_SECONDARY
    - FALLBACK_MODEL_TERTIARY
    - AZURE_SEARCH_ENDPOINT
    - AZURE_SEARCH_API_KEY
    - AZURE_SEARCH_INDEX_NAME
    - AZURE_SUBSCRIPTION_ID
    - AZURE_RESOURCE_GROUP
    - AZURE_CONTAINER_REGISTRY
    - AZURE_CONTAINER_APP_ENV
    - GITHUB_TOKEN
    - GITHUB_ORG
    - BING_SEARCH_API_KEY
    - APP_ENV
    - LOG_LEVEL
    - MAX_CONCURRENT_JOBS
    - JOB_TIMEOUT_SECONDS
    - SESSION_STORE_PATH
    - RATE_LIMIT_REQUESTS
    - RATE_LIMIT_WINDOW_SECONDS
    - PYTHONPATH=/app/backend
    - REDIS_URL=redis://redis:6379/0
    - API_KEY=${API_KEY}
    - AZURE_OPENAI_ENDPOINT
    - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
    - SECRET_KEY=${SECRET_KEY}
    command: celery -A backend.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A backend.celery_app inspect ping -d celery@$$HOSTNAME | grep -q OK
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  frontend:
    image: ${AI_FRONTEND_IMAGE:-ghcr.io/zolexora/zolexora-ai-frontend:latest}
    pull_policy: missing
    environment:
    - VITE_API_KEY=${VITE_API_KEY}
    ports: []
    depends_on:
    - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
  nginx:
    image: ${AI_NGINX_IMAGE:-ghcr.io/zolexora/zolexora-ai-nginx:latest}
    pull_policy: missing
    container_name: zolexora-ai-nginx
    ports:
    - 3091:80
    depends_on:
    - backend
    - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
networks:
  default:
    name: swarm-factory-net
