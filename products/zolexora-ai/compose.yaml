services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: production
    env_file: .env
    ports:
    - 4090:4090
    environment:
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/app/backend
    - REDIS_URL=redis://redis:6379/0
    - API_KEY=swarm-factory-dev-key
    depends_on:
    - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
  celery:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: production
    env_file: .env
    environment:
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/app/backend
    - REDIS_URL=redis://redis:6379/0
    - API_KEY=swarm-factory-dev-key
    command: celery -A backend.celery_app worker --loglevel=info --concurrency=4
    depends_on:
    - redis
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A backend.celery_app inspect ping -d celery@$$HOSTNAME | grep -q OK
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_KEY: swarm-factory-dev-key
    environment:
    - VITE_API_KEY=swarm-factory-dev-key
    ports:
    - 8080:80
    depends_on:
    - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  default:
    name: swarm-factory-net
  nginx:
    image: nginx:alpine
    container_name: zolexora-ai-nginx
    ports:
    - 80:80
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - backend
    - frontend
