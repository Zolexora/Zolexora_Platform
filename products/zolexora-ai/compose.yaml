services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: production
    env_file: .env
    ports:
    - 4090:4090
    environment:
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/app/backend
    - REDIS_URL=redis://redis:6379/0
    - API_KEY=swarm-factory-dev-key
    - AZURE_OPENAI_ENDPOINT=https://dummy.openai.azure.com/
    - AZURE_OPENAI_API_KEY=dummy
    - SECRET_KEY=dummy_secret
    depends_on:
    - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  celery:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: production
    env_file: .env
    environment:
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/app/backend
    - REDIS_URL=redis://redis:6379/0
    - API_KEY=swarm-factory-dev-key
    - AZURE_OPENAI_ENDPOINT=https://dummy.openai.azure.com/
    - AZURE_OPENAI_API_KEY=dummy
    - SECRET_KEY=dummy_secret
    command: celery -A backend.celery_app worker --loglevel=info --concurrency=4
    depends_on:
    - redis
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A backend.celery_app inspect ping -d celery@$$HOSTNAME | grep -q OK
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_KEY: swarm-factory-dev-key
    environment:
    - VITE_API_KEY=swarm-factory-dev-key
    ports: []
    depends_on:
    - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: zolexora-ai-nginx
    ports:
    - 3091:80
    depends_on:
    - backend
    - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
networks:
  default:
    name: swarm-factory-net
