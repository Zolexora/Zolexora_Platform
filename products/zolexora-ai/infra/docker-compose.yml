services:
  api:
    build:
      context: ../../../
      dockerfile: products/zolexora-ai/services/api/Dockerfile
    image: ${AI_BACKEND_IMAGE:-ghcr.io/zolexora/zolexora-ai-backend:latest}
    pull_policy: missing
    container_name: swarm-factory-api
    environment:
    - PYTHONPATH=/app/backend
    - LLM_PROVIDER
    - AZURE_OPENAI_ENDPOINT
    - AZURE_OPENAI_API_KEY
    - AZURE_OPENAI_API_VERSION
    - AZURE_OPENAI_DEPLOYMENT
    - AZURE_OPENAI_DEPLOYMENT_GPT4O
    - AZURE_OPENAI_DEPLOYMENT_PHI4
    - AZURE_OPENAI_DEPLOYMENT_MINI
    - FALLBACK_MODEL_PRIMARY
    - FALLBACK_MODEL_SECONDARY
    - FALLBACK_MODEL_TERTIARY
    - API_KEY
    - SECRET_KEY
    - AZURE_SEARCH_ENDPOINT
    - AZURE_SEARCH_API_KEY
    - AZURE_SEARCH_INDEX_NAME
    - AZURE_SUBSCRIPTION_ID
    - AZURE_RESOURCE_GROUP
    - AZURE_CONTAINER_REGISTRY
    - AZURE_CONTAINER_APP_ENV
    - GITHUB_TOKEN
    - GITHUB_ORG
    - BING_SEARCH_API_KEY
    - APP_ENV
    - LOG_LEVEL
    - MAX_CONCURRENT_JOBS
    - JOB_TIMEOUT_SECONDS
    - SESSION_STORE_PATH
    - RATE_LIMIT_REQUESTS
    - RATE_LIMIT_WINDOW_SECONDS
    - REDIS_URL=redis://redis:6379/0
    volumes:
    - ../backend:/app/backend
    ports:
    - 4090:4090
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:4090/health
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
    - swarm-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  redis:
    image: redis:7-alpine
    container_name: swarm-factory-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - swarm-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  worker:
    build:
      context: ../../../
      dockerfile: products/zolexora-ai/services/api/Dockerfile
    image: ${AI_BACKEND_IMAGE:-ghcr.io/zolexora/zolexora-ai-backend:latest}
    pull_policy: missing
    container_name: swarm-factory-worker
    environment:
    - PYTHONPATH=/app/backend
    - LLM_PROVIDER
    - AZURE_OPENAI_ENDPOINT
    - AZURE_OPENAI_API_KEY
    - AZURE_OPENAI_API_VERSION
    - AZURE_OPENAI_DEPLOYMENT
    - AZURE_OPENAI_DEPLOYMENT_GPT4O
    - AZURE_OPENAI_DEPLOYMENT_PHI4
    - AZURE_OPENAI_DEPLOYMENT_MINI
    - FALLBACK_MODEL_PRIMARY
    - FALLBACK_MODEL_SECONDARY
    - FALLBACK_MODEL_TERTIARY
    - API_KEY
    - SECRET_KEY
    - AZURE_SEARCH_ENDPOINT
    - AZURE_SEARCH_API_KEY
    - AZURE_SEARCH_INDEX_NAME
    - AZURE_SUBSCRIPTION_ID
    - AZURE_RESOURCE_GROUP
    - AZURE_CONTAINER_REGISTRY
    - AZURE_CONTAINER_APP_ENV
    - GITHUB_TOKEN
    - GITHUB_ORG
    - BING_SEARCH_API_KEY
    - APP_ENV
    - LOG_LEVEL
    - MAX_CONCURRENT_JOBS
    - JOB_TIMEOUT_SECONDS
    - SESSION_STORE_PATH
    - RATE_LIMIT_REQUESTS
    - RATE_LIMIT_WINDOW_SECONDS
    - REDIS_URL=redis://redis:6379/0
    volumes:
    - ../backend:/app/backend
    command:
    - celery
    - -A
    - backend.celery_app
    - worker
    - --loglevel=info
    - --concurrency=2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - swarm-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
  nginx:
    image: nginx:1.25-alpine
    container_name: swarm-factory-nginx
    ports:
    - 80:80
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - api
    restart: unless-stopped
    networks:
    - swarm-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  redis-data: null
networks:
  swarm-net:
    driver: bridge
