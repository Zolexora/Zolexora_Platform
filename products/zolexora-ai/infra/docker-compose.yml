version: '3.9'
services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: swarm-factory-api:local
    container_name: swarm-factory-api
    env_file:
    - ../.env
    environment:
    - PYTHONPATH=/app/backend
    - REDIS_URL=redis://redis:6379/0
    volumes:
    - ../backend:/app/backend
    ports:
    - 4090:4090
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:4090/health
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
    - swarm-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  redis:
    image: redis:7-alpine
    container_name: swarm-factory-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - swarm-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: swarm-factory-api:local
    container_name: swarm-factory-worker
    env_file:
    - ../.env
    environment:
    - PYTHONPATH=/app/backend
    - REDIS_URL=redis://redis:6379/0
    volumes:
    - ../backend:/app/backend
    command:
    - celery
    - -A
    - backend.celery_app
    - worker
    - --loglevel=info
    - --concurrency=2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - swarm-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
  nginx:
    image: nginx:1.25-alpine
    container_name: swarm-factory-nginx
    ports:
    - 80:80
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - api
    restart: unless-stopped
    networks:
    - swarm-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  redis-data: null
networks:
  swarm-net:
    driver: bridge
