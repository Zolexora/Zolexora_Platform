services:
  postgres:
    image: postgres:15-alpine
    container_name: ttc-postgres
    environment:
      POSTGRES_USER: ttc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ttc
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ttc -d ttc
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  redis:
    image: redis:7-alpine
    container_name: ttc-redis
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  backend:
    image: ${TEXTILE_CARE_BACKEND_IMAGE:-ghcr.io/zolexora/zolexora-textile-care-backend:latest}
    pull_policy: missing
    container_name: ttc-backend
    environment:
    - DATABASE_URL=postgresql+psycopg://ttc:${POSTGRES_PASSWORD}@postgres:5432/ttc
    - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:4010/api/v1/health')
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  admin-web:
    image: ${TEXTILE_CARE_ADMIN_WEB_IMAGE:-ghcr.io/zolexora/zolexora-textile-care-admin-web:latest}
    pull_policy: missing
    container_name: ttc-admin-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
  seller-web:
    image: ${TEXTILE_CARE_SELLER_WEB_IMAGE:-ghcr.io/zolexora/zolexora-textile-care-seller-web:latest}
    pull_policy: missing
    container_name: ttc-seller-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
  marketplace-web:
    image: ${TEXTILE_CARE_MARKETPLACE_WEB_IMAGE:-ghcr.io/zolexora/zolexora-textile-care-marketplace-web:latest}
    pull_policy: missing
    container_name: ttc-marketplace-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
  nginx:
    image: ${TEXTILE_CARE_NGINX_IMAGE:-ghcr.io/zolexora/zolexora-textile-care-nginx:latest}
    pull_policy: missing
    container_name: ttc-nginx
    ports:
    - "3080:80"
    depends_on:
    - backend
    - admin-web
    - seller-web
    - marketplace-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
volumes:
  postgres_data: null
