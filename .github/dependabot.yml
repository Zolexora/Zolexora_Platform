# Weekly dependency updates. One npm entry covers the whole pnpm workspace (root lockfile).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories:
      - /apps/zolexora-platform-admin/backend
      - /apps/core-platform/zolexora-ai/services/api
      - /apps/core-platform/zolexora-ai/services/api/backend
      - /apps/core-platform/zolexora-ims/services/user-api
      - /apps/standalone-apps/ironclub/services/backend
      - /apps/core-platform/zolexora-shop/services/marketplace-api
      - /apps/standalone-apps/textile-care/services/backend
      - /apps/core-platform/zolexora-tms/services/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: gradle
    directory: /apps/standalone-apps/maunkavach
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /infrastructure/containers/docker
      - /apps/core-platform/*
      - /apps/standalone-apps/*
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
