name: Setup Python
description: Installs Python with the pip cache and optionally installs requirement files / packages.
inputs:
  python-version:
    description: Python version
    default: '3.12'
  requirements:
    description: Space-separated requirement files (pip install -r each)
    default: ''
  packages:
    description: Extra pip packages / editable paths (pip install <packages>)
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.requirements != '' && inputs.requirements || '**/requirements*.txt' }}
    - shell: bash
      env:
        REQS: ${{ inputs.requirements }}
        PKGS: ${{ inputs.packages }}
      run: |
        python -m pip install --upgrade pip
        for r in $REQS; do pip install -r "$r"; done
        if [ -n "$PKGS" ]; then pip install $PKGS; fi
