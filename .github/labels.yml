# Repository labels. Synced by .github/workflows/labels.yml (crazy-max/ghaction-github-labeler).
- name: "bug"
  color: "d73a4a"
  description: "Something is broken"
- name: "feature"
  color: "a2eeef"
  description: "New functionality"
- name: "enhancement"
  color: "84b6eb"
  description: "Improvement to existing functionality"
- name: "breaking-change"
  color: "b60205"
  description: "Requires consumers or operators to change something"
- name: "security"
  color: "ee0701"
  description: "Security fix or hardening"
- name: "documentation"
  color: "0075ca"
  description: "Docs only"
- name: "refactor"
  color: "c5def5"
  description: "Code change without behaviour change"
- name: "chore"
  color: "fef2c0"
  description: "Tooling, cleanup, housekeeping"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates"
- name: "ci"
  color: "1d76db"
  description: "GitHub Actions / CI"
- name: "docker"
  color: "0db7ed"
  description: "Dockerfiles, Compose, GHCR images"
- name: "infrastructure"
  color: "5319e7"
  description: "infrastructure/ and deployment"
- name: "skip-changelog"
  color: "ededed"
  description: "Exclude from release notes"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "stale"
  color: "cfd3d7"
  description: "No activity; will be closed"
- name: "pinned"
  color: "006b75"
  description: "Never mark stale"
