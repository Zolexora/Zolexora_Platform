name: Zolexora Shop — Docker images

# Builds every image in apps/platform-apps/marketplace/compose.yaml and pushes ghcr.io/zolexora/zolexora-shop-<service>:{latest,<sha>}.
on:
  push:
    branches: [main]
    paths:
      - 'apps/platform-apps/marketplace/**'
      - 'packages/**'
      - 'infrastructure/containers/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/zolexora-shop-docker.yml'
      - '.github/workflows/reusable-docker-ghcr.yml'
      - '.github/actions/docker-login/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      product: shop
      services: |
        [
          {
            "service": "admin-web",
            "file": "infrastructure/containers/docker/Dockerfile.nextjs",
            "build-args": "APP_DIR=apps/platform-apps/marketplace/apps/admin\nAPP_NAME=@zolexora/shop-admin"
          },
          {
            "service": "backend",
            "file": "infrastructure/containers/docker/Dockerfile.api-python",
            "build-args": "APP_DIR=apps/platform-apps/marketplace/services/marketplace-api"
          },
          {
            "service": "mahila-web",
            "file": "infrastructure/containers/docker/Dockerfile.cra",
            "build-args": "APP_DIR=apps/platform-apps/marketplace/apps/web/mahila-madel\nAPP_NAME=@zolexora/shop-mahila-madel-web"
          },
          {
            "service": "nginx",
            "file": "apps/platform-apps/marketplace/Dockerfile.nginx"
          },
          {
            "service": "seller-web",
            "file": "infrastructure/containers/docker/Dockerfile.nextjs",
            "build-args": "APP_DIR=apps/platform-apps/marketplace/apps/web/zolexora-seller\nAPP_NAME=@zolexora/shop-seller-web"
          },
          {
            "service": "shop-web",
            "file": "infrastructure/containers/docker/Dockerfile.nextjs",
            "build-args": "APP_DIR=apps/platform-apps/marketplace/apps/web/zolexora-shop\nAPP_NAME=@zolexora/shop-web"
          }
        ]
