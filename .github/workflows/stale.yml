name: Repo — Stale issues and PRs

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security
          stale-issue-message: No activity for 60 days. This issue will be closed in 14 days unless there is new activity.
          stale-pr-message: No activity for 60 days. This PR will be closed in 14 days unless it is updated.
