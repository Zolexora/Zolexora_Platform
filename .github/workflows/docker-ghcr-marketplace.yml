name: Build & Publish Marketplace Containers to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'products/zolexora-marketplace/**'
      - 'infrastructure/containers/docker/Dockerfile.nextjs'
      - 'infrastructure/containers/docker/Dockerfile.cra'
      - 'infrastructure/containers/docker/Dockerfile.api-python'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/docker-ghcr-marketplace.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-marketplace-images:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: marketplace-api
            context: ./products/zolexora-marketplace/services/marketplace-api
            file: ./infrastructure/containers/docker/Dockerfile.api-python
            build-args: ""

          - service: marketplace-admin
            context: .
            file: ./infrastructure/containers/docker/Dockerfile.nextjs
            build-args: |
              APP_NAME=@zolexora/marketplace-admin
              APP_DIR=products/zolexora-marketplace/apps/portals/marketplace-admin/web

          - service: marketplace-seller
            context: .
            file: ./infrastructure/containers/docker/Dockerfile.nextjs
            build-args: |
              APP_NAME=@zolexora/seller-portal
              APP_DIR=products/zolexora-marketplace/apps/portals/seller/web

          - service: marketplace-shop
            context: .
            file: ./infrastructure/containers/docker/Dockerfile.nextjs
            build-args: |
              APP_NAME=@zolexora/storefront-zolexora-shop
              APP_DIR=products/zolexora-marketplace/apps/storefronts/zolexora-shop/web

          - service: marketplace-mahila
            context: .
            file: ./infrastructure/containers/docker/Dockerfile.cra
            build-args: |
              APP_NAME=@zolexora/storefront-mahila-madel
              APP_DIR=products/zolexora-marketplace/apps/storefronts/mahila-madel/web

          - service: marketplace-nginx
            context: ./products/zolexora-marketplace
            file: ./products/zolexora-marketplace/Dockerfile.nginx
            build-args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase repository and image tag
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_OWNER}/${{ matrix.service }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Pre-built container for ${{ matrix.service }} in Zolexora Platform
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
