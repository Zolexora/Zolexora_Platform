name: The Textile Care — Docker images

# Builds every image in apps/standalone-apps/textile-care/compose.yaml and pushes ghcr.io/zolexora/zolexora-textile-care-<service>:{latest,<sha>}.
on:
  push:
    branches: [main]
    paths:
      - 'apps/standalone-apps/textile-care/**'
      - 'packages/**'
      - 'infrastructure/containers/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/textile-care-docker.yml'
      - '.github/workflows/reusable-docker-ghcr.yml'
      - '.github/actions/docker-login/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      product: textile-care
      services: |
        [
          {
            "service": "admin-web",
            "file": "apps/standalone-apps/textile-care/Dockerfile.web",
            "build-args": "APP_PATH=apps/admin-web"
          },
          {
            "service": "backend",
            "file": "apps/standalone-apps/textile-care/services/backend/Dockerfile"
          },
          {
            "service": "marketplace-web",
            "file": "apps/standalone-apps/textile-care/Dockerfile.web",
            "build-args": "APP_PATH=apps/marketplace-web"
          },
          {
            "service": "nginx",
            "file": "apps/standalone-apps/textile-care/Dockerfile.nginx"
          },
          {
            "service": "seller-web",
            "file": "apps/standalone-apps/textile-care/Dockerfile.web",
            "build-args": "APP_PATH=apps/seller-web"
          }
        ]
