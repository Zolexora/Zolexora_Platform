name: Platform — CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      - name: Shell syntax
        run: |
          bash -n scripts/*.sh
      - name: Python formatting and lint
        run: |
          black --check products/zolexora-erp/backend/zolexora_core products/zolexora-erp/backend/zolexora_branding products/zolexora-erp/backend/zolexora_platform products/zolexora-erp/backend/zolexora_integrations
          ruff check products/zolexora-erp/backend/zolexora_core products/zolexora-erp/backend/zolexora_branding products/zolexora-erp/backend/zolexora_platform products/zolexora-erp/backend/zolexora_integrations
      - name: Documentation files exist
        run: |
          test -f docs/production-guide.md
          test -f docs/security-review.md
          test -f docs/disaster-recovery-report.md
          test -f docs/upgrade-validation-report.md
          test -f docs/phase-3.8-production-certification-report.md

  docker-operational-validation:
    runs-on: ubuntu-latest
    needs: static-validation
    timeout-minutes: 60
    name: docker-operational-validation (INSTALL_PAYMENTS=${{ matrix.install_payments }})
    strategy:
      fail-fast: false
      matrix:
        install_payments: ["0", "1"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure Env Template
        run: |
          cp config/envs/zolexora-erp/erp.env.example config/envs/zolexora-erp/erp.env
          if grep -q "^INSTALL_PAYMENTS=" config/envs/zolexora-erp/erp.env; then
            sed -i "s/^INSTALL_PAYMENTS=.*/INSTALL_PAYMENTS=${{ matrix.install_payments }}/" config/envs/zolexora-erp/erp.env
          else
            echo "INSTALL_PAYMENTS=${{ matrix.install_payments }}" >> config/envs/zolexora-erp/erp.env
          fi
          grep "^INSTALL_PAYMENTS=" config/envs/zolexora-erp/erp.env
      - name: Build Docker images
        run: docker compose -f compose.yaml build --pull
      - name: Start Compose stack
        run: docker compose -f compose.yaml up -d
      - name: Run clean bootstrap
        run: ./scripts/zolexora-erp/bootstrap-frappe-site.sh
      - name: Run idempotent bootstrap
        run: ./scripts/zolexora-erp/bootstrap-frappe-site.sh
      - name: Run healthcheck
        run: ./scripts/zolexora-erp/check-frappe-stack-health.sh
      - name: Verify Payments matrix path
        run: |
          docker compose -f compose.yaml exec -T backend bench --site site1.example.com list-apps
          if [ "${{ matrix.install_payments }}" = "1" ]; then
            docker compose -f compose.yaml exec -T backend bench --site site1.example.com list-apps | awk '{print $1}' | grep -qx "payments"
            docker compose -f compose.yaml exec -T backend bench --site site1.example.com console <<'PY'
          import frappe
          assert "payments" in frappe.get_installed_apps(), "payments app not installed"
          assert frappe.db.exists("DocType", "Payment Gateway"), "Payment Gateway DocType missing"
          print("PAYMENTS_CI_OK")
          PY
          else
            echo "INSTALL_PAYMENTS=0 path validated"
          fi
      - name: Generate verified backup
        run: ./scripts/zolexora-erp/backup-frappe-site.sh
      - name: Restore latest backup
        run: |
          latest_backup="$(find storage/backups -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          (cd "$latest_backup" && sha256sum -c SHA256SUMS)
          ./scripts/zolexora-erp/restore-frappe-site.sh "$latest_backup"
      - name: Run post-restore healthcheck
        run: ./scripts/zolexora-erp/check-frappe-stack-health.sh
      - name: Verify post-restore Payments state
        run: |
          if [ "${{ matrix.install_payments }}" = "1" ]; then
            docker compose -f compose.yaml exec -T backend bench --site site1.example.com list-apps | awk '{print $1}' | grep -qx "payments"
            docker compose -f compose.yaml exec -T backend bench --site site1.example.com console <<'PY'
          import frappe
          assert "payments" in frappe.get_installed_apps(), "payments app not installed after restore"
          assert frappe.db.exists("DocType", "Payment Gateway"), "Payment Gateway DocType missing after restore"
          print("PAYMENTS_RESTORE_CI_OK")
          PY
          else
            echo "INSTALL_PAYMENTS=0 post-restore path validated"
          fi
      - name: Custom app import checks
        run: |
          docker compose -f compose.yaml exec -T backend bench --site site1.example.com execute zolexora_core.site_setup.validate_custom_app_imports
      - name: Upgrade compatibility validation
        run: RUN_UPGRADE_BUILD=1 ./scripts/zolexora-erp/tests/test-upgrade-validation.sh
      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml down -v

  destructive-disaster-recovery:
    runs-on: ubuntu-latest
    needs: docker-operational-validation
    if: false
    steps:
      - run: |
          echo "Full destructive DR is intentionally disabled in lightweight CI."
          echo "Run locally or in staging with ZOLEXORA_ALLOW_DESTRUCTIVE_DR=1 ./scripts/zolexora-erp/tests/test-disaster-recovery.sh"
