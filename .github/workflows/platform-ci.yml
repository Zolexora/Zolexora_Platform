name: Platform — CI

# Repo-wide static checks that guard the monorepo conventions in AGENTS.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax (all tracked scripts)
        run: git ls-files '*.sh' | grep -v '/services/frappe/' | xargs -r -n1 bash -n
      - name: Compose files are valid
        run: |
          for f in compose.yaml apps/*/compose.yaml products/*/compose.yaml; do
            echo "::group::$f"; docker compose -f "$f" config -q; echo "::endgroup::"
          done
      - name: Compose builds use the repo root and GHCR images
        run: |
          bad=0
          for f in compose.yaml apps/*/compose.yaml products/*/compose.yaml; do
            docker compose -f "$f" config --no-interpolate --format json | F="$f" python3 -c '
          import json, os, sys
          d = json.load(sys.stdin); f = os.environ["F"]; root = os.getcwd(); bad = 0
          for n, s in d["services"].items():
              b = s.get("build")
              if not b: continue
              if b["context"].rstrip("/") != root:
                  print(f"::error file={f}::{n}: build context must be the repo root"); bad = 1
              if "ghcr.io/zolexora/" not in s.get("image", "") or s.get("pull_policy") != "missing":
                  print(f"::error file={f}::{n}: needs image ghcr.io/zolexora/... and pull_policy: missing"); bad = 1
          sys.exit(bad)' || bad=1
          done
          exit $bad
      - name: No .env files or templates committed
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)|\.env\.example$'; then
            echo "::error::.env files are not allowed (Infisical is the only secret source)"; exit 1
          fi
      - name: No forced rebuilds in start scripts
        run: |
          if git ls-files '*.sh' | xargs grep -nE 'up -d --build|up --build -d' | grep -v 'grep -q'; then
            echo "::error::start scripts must pull + up -d, never force --build (AGENTS.md)"; exit 1
          fi
      - name: Lint workflows (actionlint)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -shellcheck=
