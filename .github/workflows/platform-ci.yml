name: Platform — CI

# Repo-wide static checks that guard the monorepo conventions in AGENTS.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax (all tracked scripts)
        run: git ls-files '*.sh' | grep -v '/services/frappe/' | xargs -r -n1 bash -n
      - name: Compose files are valid
        run: |
          for f in apps/*/compose.yaml products/*/compose.yaml; do
            echo "::group::$f"; docker compose -f "$f" config -q; echo "::endgroup::"
          done
      - name: Compose only pulls CI-built GHCR images (no local builds)
        run: |
          bad=0
          for f in apps/*/compose.yaml products/*/compose.yaml; do
            docker compose -f "$f" config --no-interpolate --format json | F="$f" python3 -c '
          import json, os, sys
          d = json.load(sys.stdin); f = os.environ["F"]; bad = 0
          for n, s in d["services"].items():
              img = s.get("image", "")
              if s.get("build"):
                  print(f"::error file={f}::{n}: no build: blocks; images are built only in GitHub CI"); bad = 1
              if "ghcr.io/zolexora/" in img and s.get("pull_policy") != "missing":
                  print(f"::error file={f}::{n}: needs pull_policy: missing"); bad = 1
              if not img:
                  print(f"::error file={f}::{n}: needs an image"); bad = 1
          sys.exit(bad)' || bad=1
          done
          exit $bad
      - name: No .env files or templates committed
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)|\.env\.example$'; then
            echo "::error::.env files are not allowed (Infisical is the only secret source)"; exit 1
          fi
      - name: No local image builds in scripts
        run: |
          if git ls-files '*.sh' | grep -v '/services/frappe/' | xargs grep -nE 'docker (compose .*)?build\b|compose build|up (-d )?--build|--ignore-pull-failures'; then
            echo "::error::images are built only in GitHub CI; scripts pull strictly and never build (AGENTS.md)"; exit 1
          fi
      - name: Lint workflows (actionlint)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -shellcheck=
