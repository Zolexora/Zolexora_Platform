name: Zolexora AI — CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/platform-core/zolexora-ai/**'
      - '.github/workflows/zolexora-ai-ci.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'apps/platform-core/zolexora-ai/**'
      - '.github/workflows/zolexora-ai-ci.yml'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/platform-core/zolexora-ai/services/api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.11'
          requirements: apps/platform-core/zolexora-ai/services/api/requirements.txt
          packages: ruff pytest pytest-cov pytest-asyncio
      - name: Lint (advisory)
        run: ruff check backend/
        continue-on-error: true
      - name: Test
        # backend/tests/conftest.py sets test-only stub settings; no real secrets are used.
        run: pytest backend/tests tests --cov=backend --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zolexora-ai-coverage
          path: apps/platform-core/zolexora-ai/services/api/coverage.xml
          retention-days: 14

  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          install: --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @zolexora/ai-web run typecheck
      - run: pnpm --filter @zolexora/ai-web run lint
      - run: pnpm --filter @zolexora/ai-web run build
