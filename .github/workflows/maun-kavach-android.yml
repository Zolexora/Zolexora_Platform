name: MaunKavach — Android

on:
  push:
    branches: [main]
    paths:
      - "products/maunkavach/app/**"
      - "products/maunkavach/gradle/**"
      - "products/maunkavach/*.kts"
      - "products/maunkavach/*.properties"
      - ".github/workflows/maun-kavach-android.yml"
    tags:
      - "maunkavach-v*"
  pull_request:
    paths:
      - "products/maunkavach/app/**"
      - "products/maunkavach/gradle/**"
      - "products/maunkavach/*.kts"
      - ".github/workflows/maun-kavach-android.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]

permissions:
  contents: write

defaults:
  run:
    working-directory: products/maunkavach

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Debug build — runs on every PR and push to main
  # ─────────────────────────────────────────────────────────────────
  build-debug:
    name: Build (debug)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maunkavach-debug-${{ github.sha }}
          path: products/maunkavach/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Distribute to testers via Firebase App Distribution
        # Only runs on push to main — continue-on-error if Firebase secrets are not set
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.MAUNKAVACH_FIREBASE_APP_ID }}
          token: ${{ secrets.MAUNKAVACH_FIREBASE_TOKEN }}
          groups: internal-team, qa-team
          file: products/maunkavach/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Release build — runs on version tags (maunkavach-v*)
  #         or manual workflow_dispatch with build_type=release
  #
  # Required GitHub Secrets:
  #   MAUNKAVACH_SERVER_BASE_URL        — production API base URL (https://...)
  #   MAUNKAVACH_KEYSTORE_BASE64        — base64-encoded .jks keystore file
  #   MAUNKAVACH_RELEASE_STORE_PASSWORD — keystore password
  #   MAUNKAVACH_RELEASE_KEY_ALIAS      — key alias inside keystore
  #   MAUNKAVACH_RELEASE_KEY_PASSWORD   — key password
  #
  # Required for Firebase App Distribution (debug builds on main):
  #   MAUNKAVACH_FIREBASE_APP_ID        — Firebase Console → Project Settings → Your Apps
  #   MAUNKAVACH_FIREBASE_TOKEN         — run: firebase login:ci  (copy the printed token)
  # ─────────────────────────────────────────────────────────────────
  build-release:
    name: Build (release AAB)
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/maunkavach-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')
    env:
      MAUNKAVACH_SERVER_BASE_URL: ${{ secrets.MAUNKAVACH_SERVER_BASE_URL }}
      MAUNKAVACH_RELEASE_STORE_FILE: maunkavach-release.jks
      MAUNKAVACH_RELEASE_STORE_PASSWORD: ${{ secrets.MAUNKAVACH_RELEASE_STORE_PASSWORD }}
      MAUNKAVACH_RELEASE_KEY_ALIAS: ${{ secrets.MAUNKAVACH_RELEASE_KEY_ALIAS }}
      MAUNKAVACH_RELEASE_KEY_PASSWORD: ${{ secrets.MAUNKAVACH_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify release secrets and decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAUNKAVACH_KEYSTORE_BASE64 }}
        run: |
          missing=0
          for var in MAUNKAVACH_SERVER_BASE_URL MAUNKAVACH_RELEASE_STORE_PASSWORD MAUNKAVACH_RELEASE_KEY_ALIAS MAUNKAVACH_RELEASE_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error title=Missing Secret::$var secret is not configured in GitHub Actions"
              missing=1
            fi
          done
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error title=Missing Secret::MAUNKAVACH_KEYSTORE_BASE64 secret is not configured in GitHub Actions"
            missing=1
          fi
          if [ $missing -ne 0 ]; then
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/maunkavach-release.jks
          cp app/maunkavach-release.jks maunkavach-release.jks

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build release APK (for Firebase / direct install)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Inspect built release binaries
        run: |
          echo "=== Release Bundle outputs ==="
          ls -la app/build/outputs/bundle/release/ || true
          echo "=== Release APK outputs ==="
          ls -la app/build/outputs/apk/release/ || true

      - name: Clean up keystore
        if: always()
        run: rm -f app/maunkavach-release.jks maunkavach-release.jks

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: maunkavach-release-aab-${{ github.ref_name }}
          path: products/maunkavach/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: maunkavach-release-apk-${{ github.ref_name }}
          path: products/maunkavach/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/maunkavach-v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: MaunKavach ${{ github.ref_name }}
          files: |
            products/maunkavach/app/build/outputs/bundle/release/*.aab
            products/maunkavach/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
