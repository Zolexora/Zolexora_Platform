name: Platform Admin — Docker images

# Builds every image in apps/platform-admin/compose.yaml and pushes ghcr.io/zolexora/zolexora-platform-admin-<service>:{latest,<sha>}.
on:
  push:
    branches: [main]
    paths:
      - 'apps/platform-admin/**'
      - 'packages/**'
      - 'infrastructure/containers/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/zolexora-platform-admin-docker.yml'
      - '.github/workflows/reusable-docker-ghcr.yml'
      - '.github/actions/docker-login/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      product: platform-admin
      services: |
        [
          {
            "service": "backend",
            "file": "apps/platform-admin/backend/Dockerfile"
          },
          {
            "service": "frontend",
            "file": "apps/platform-admin/frontend/Dockerfile"
          },
          {
            "service": "nginx",
            "file": "apps/platform-admin/Dockerfile.nginx"
          }
        ]
