name: TheTextileCare — Web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/TheTextileCare
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: products/TheTextileCare/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ttc/marketplace-web build
      - run: pnpm --filter @ttc/seller-web build
      - run: pnpm --filter @ttc/admin-web build
