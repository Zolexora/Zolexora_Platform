name: Zolexora IMS — CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/core-platform/zolexora-ims/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/zolexora-ims-ci.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'apps/core-platform/zolexora-ims/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/zolexora-ims-ci.yml'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core-platform/zolexora-ims/services/user-api
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.11'
          requirements: apps/core-platform/zolexora-ims/services/user-api/requirements.txt
          packages: pytest
      - run: PYTHONPATH=. pytest tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - run: pnpm --filter "@zolexora/ims-user-frontend..." build
