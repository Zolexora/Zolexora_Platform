name: Build & Publish IronClub Containers to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'products/zolexora-ironclub/**'
      - '.github/workflows/docker-ghcr-ironclub.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-ironclub-images:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ironclub-api
            context: ./products/zolexora-ironclub/apps/backend
            file: ./products/zolexora-ironclub/apps/backend/Dockerfile
            build-args: ""

          - service: ironclub-admin
            context: ./products/zolexora-ironclub
            file: ./products/zolexora-ironclub/Dockerfile.vite-app
            build-args: APP_DIR=apps/admin-web

          - service: ironclub-manager
            context: ./products/zolexora-ironclub
            file: ./products/zolexora-ironclub/Dockerfile.vite-app
            build-args: APP_DIR=apps/manager-web

          - service: ironclub-marketing
            context: ./products/zolexora-ironclub
            file: ./products/zolexora-ironclub/Dockerfile.vite-app
            build-args: APP_DIR=apps/marketing-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase repository and image tag
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_OWNER}/${{ matrix.service }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Pre-built container for ${{ matrix.service }} in Zolexora Platform
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
