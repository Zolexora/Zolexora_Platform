name: Reusable — Infisical Secrets

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment slug (dev | staging | prod)'
        required: true
        type: string
      secret_path:
        description: 'Infisical secret path (e.g. /zolexora-ims)'
        required: true
        type: string
    secrets:
      INFISICAL_CLIENT_ID:
        required: true
      INFISICAL_CLIENT_SECRET:
        required: true

jobs:
  fetch-secrets:
    name: Fetch Secrets from Infisical
    runs-on: ubuntu-latest
    steps:
      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo bash
          sudo apt-get install -y infisical

      - name: Export Secrets to Environment
        uses: Infisical/secrets-action@v1.0.18
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: ${{ inputs.environment }}
          secret-path: ${{ inputs.secret_path }}
          export-type: env
