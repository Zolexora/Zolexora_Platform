name: Zolexora Marketplace — Docker images

# Builds every image in products/zolexora-marketplace/compose.yaml and pushes ghcr.io/zolexora/zolexora-marketplace-<service>:{latest,<sha>}.
on:
  push:
    branches: [main]
    paths:
      - 'products/zolexora-marketplace/**'
      - 'packages/**'
      - 'platform/**'
      - 'infrastructure/containers/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/zolexora-marketplace-docker.yml'
      - '.github/workflows/reusable-docker-ghcr.yml'
      - '.github/actions/docker-login/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      product: marketplace
      services: |
        [
          {
            "service": "admin-web",
            "file": "infrastructure/containers/docker/Dockerfile.nextjs",
            "build-args": "APP_DIR=products/zolexora-marketplace/apps/portals/marketplace-admin/web\nAPP_NAME=@zolexora/marketplace-admin"
          },
          {
            "service": "backend",
            "file": "infrastructure/containers/docker/Dockerfile.api-python",
            "build-args": "APP_DIR=products/zolexora-marketplace/services/marketplace-api"
          },
          {
            "service": "mahila-web",
            "file": "infrastructure/containers/docker/Dockerfile.cra",
            "build-args": "APP_DIR=products/zolexora-marketplace/apps/storefronts/mahila-madel/web\nAPP_NAME=@zolexora/marketplace-mahila-madel-web"
          },
          {
            "service": "nginx",
            "file": "products/zolexora-marketplace/Dockerfile.nginx"
          },
          {
            "service": "seller-web",
            "file": "infrastructure/containers/docker/Dockerfile.nextjs",
            "build-args": "APP_DIR=products/zolexora-marketplace/apps/portals/seller/web\nAPP_NAME=@zolexora/marketplace-seller-web"
          },
          {
            "service": "shop-web",
            "file": "infrastructure/containers/docker/Dockerfile.nextjs",
            "build-args": "APP_DIR=products/zolexora-marketplace/apps/storefronts/zolexora-shop/web\nAPP_NAME=@zolexora/marketplace-shop-web"
          }
        ]
