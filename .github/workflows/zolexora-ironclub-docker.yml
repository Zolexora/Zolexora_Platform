name: Zolexora IronClub — Docker images

# Builds every image in products/zolexora-ironclub/compose.yaml and pushes ghcr.io/zolexora/zolexora-ironclub-<service>:{latest,<sha>}.
on:
  push:
    branches: [main]
    paths:
      - 'products/zolexora-ironclub/**'
      - 'packages/**'
      - 'infrastructure/containers/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/zolexora-ironclub-docker.yml'
      - '.github/workflows/reusable-docker-ghcr.yml'
      - '.github/actions/docker-login/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      product: ironclub
      services: |
        [
          {
            "service": "backend",
            "file": "products/zolexora-ironclub/services/backend/Dockerfile"
          }
        ]
