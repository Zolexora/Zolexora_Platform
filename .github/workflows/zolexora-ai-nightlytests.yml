name: Zolexora AI — Nightly tests

on:
  schedule:
    - cron: "0 2 * * *"   # 2 AM UTC every night
  workflow_dispatch:        # also allow manual trigger

permissions:
  contents: read

jobs:
  test-backend:
    name: Backend — full test suite
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.11'
          requirements: apps/core-platform/zolexora-ai/services/api/requirements.txt
          packages: pytest pytest-cov pytest-asyncio

      - name: Run unit tests with coverage
        env:
          REDIS_URL: redis://localhost:6379/0
        working-directory: apps/core-platform/zolexora-ai/services/api
        run: |
          pytest backend/tests tests \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: apps/core-platform/zolexora-ai/services/api/coverage.xml
          fail_ci_if_error: false

  test-frontend:
    name: Frontend — type check + lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node
        with:
          install: --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm --filter @zolexora/ai-web run typecheck

      - name: Lint
        run: pnpm --filter @zolexora/ai-web run lint
