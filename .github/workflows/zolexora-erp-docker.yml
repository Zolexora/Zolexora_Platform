name: Zolexora ERP — Docker images

# Builds every image in apps/core-platform/zolexora-erp/compose.yaml and pushes ghcr.io/zolexora/zolexora-erp-<service>:{latest,<sha>}.
on:
  push:
    branches: [main]
    paths:
      - 'apps/core-platform/zolexora-erp/**'
      - 'scripts/docker/**'
      - 'packages/**'
      - 'infrastructure/containers/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/zolexora-erp-docker.yml'
      - '.github/workflows/reusable-docker-ghcr.yml'
      - '.github/actions/docker-login/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      product: erp
      services: |
        [
          {
            "service": "backend",
            "file": "infrastructure/containers/docker/Dockerfile",
            "build-args": "INSTALL_PAYMENTS=0"
          },
          {
            "service": "nginx",
            "file": "infrastructure/containers/compose/Dockerfile.nginx"
          }
        ]
