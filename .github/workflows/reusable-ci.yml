name: Reusable — Node CI

# Lint, type-check, test and build one pnpm workspace package (and its dependencies).
on:
  workflow_call:
    inputs:
      filter:
        description: pnpm filter, e.g. "@zolexora/tms-web..." (trailing ... includes dependencies)
        required: true
        type: string
      node-version:
        type: string
        default: '20'
      scripts:
        description: Space-separated package scripts to run if present
        type: string
        default: lint typecheck test build

permissions:
  contents: read

jobs:
  ci:
    name: ${{ inputs.filter }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ inputs.node-version }}
      - name: Run scripts
        env:
          FILTER: ${{ inputs.filter }}
          SCRIPTS: ${{ inputs.scripts }}
        run: for s in $SCRIPTS; do pnpm --filter "$FILTER" --if-present run "$s"; done
