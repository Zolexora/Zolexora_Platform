name: Rento Easy — Docker images

# Builds every image in apps/platform-apps/rentoeasy/compose.yaml and pushes ghcr.io/zolexora/zolexora-rentoeasy-<service>:{latest,<sha>}.
on:
  push:
    branches: [main]
    paths:
      - 'apps/platform-apps/rentoeasy/**'
      - 'packages/**'
      - 'infrastructure/containers/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/rentoeasy-docker.yml'
      - '.github/workflows/reusable-docker-ghcr.yml'
      - '.github/actions/docker-login/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      product: rentoeasy
      services: |
        [
          {
            "service": "api",
            "file": "apps/platform-apps/rentoeasy/Dockerfile.api"
          },
          {
            "service": "nginx",
            "file": "apps/platform-apps/rentoeasy/Dockerfile.nginx"
          },
          {
            "service": "web-admin",
            "file": "apps/platform-apps/rentoeasy/Dockerfile.web",
            "build-args": "APP_DIR=apps/platform-apps/rentoeasy/apps/web-admin"
          },
          {
            "service": "web-owner",
            "file": "apps/platform-apps/rentoeasy/Dockerfile.web",
            "build-args": "APP_DIR=apps/platform-apps/rentoeasy/apps/web-owner"
          },
          {
            "service": "web-tenant",
            "file": "apps/platform-apps/rentoeasy/Dockerfile.web",
            "build-args": "APP_DIR=apps/platform-apps/rentoeasy/apps/web-tenant"
          }
        ]
