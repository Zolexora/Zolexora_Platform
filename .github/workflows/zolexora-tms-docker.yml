name: Zolexora TMS — Docker images

# Builds every image in apps/core-platform/zolexora-tms/compose.yaml and pushes ghcr.io/zolexora/zolexora-tms-<service>:{latest,<sha>}.
on:
  push:
    branches: [main]
    paths:
      - 'apps/core-platform/zolexora-tms/**'
      - 'packages/**'
      - 'infrastructure/containers/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/zolexora-tms-docker.yml'
      - '.github/workflows/reusable-docker-ghcr.yml'
      - '.github/actions/docker-login/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      product: tms
      services: |
        [
          {
            "service": "backend",
            "file": "apps/core-platform/zolexora-tms/services/backend/Dockerfile"
          },
          {
            "service": "nginx",
            "file": "apps/core-platform/zolexora-tms/Dockerfile.nginx"
          },
          {
            "service": "admin",
            "file": "apps/core-platform/zolexora-tms/Dockerfile.web",
            "build-args": "APP_PATH=apps/tms-admin"
          },
          {
            "service": "web",
            "file": "apps/core-platform/zolexora-tms/Dockerfile.web",
            "build-args": "APP_PATH=apps/tms-web"
          }
        ]
