name: Maun Kavach — Docker images

# Builds every image in apps/platform-apps/maunkavach/compose.yaml and pushes ghcr.io/zolexora/zolexora-maunkavach-<service>:{latest,<sha>}.
on:
  push:
    branches: [main]
    paths:
      - 'apps/platform-apps/maunkavach/**'
      - 'packages/**'
      - 'infrastructure/containers/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/maunkavach-docker.yml'
      - '.github/workflows/reusable-docker-ghcr.yml'
      - '.github/actions/docker-login/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      product: maunkavach
      services: |
        [
          {
            "service": "backend",
            "file": "apps/platform-apps/maunkavach/Dockerfile.api"
          },
          {
            "service": "frontend",
            "file": "apps/platform-apps/maunkavach/Dockerfile.web"
          },
          {
            "service": "nginx",
            "file": "apps/platform-apps/maunkavach/Dockerfile.nginx"
          }
        ]
