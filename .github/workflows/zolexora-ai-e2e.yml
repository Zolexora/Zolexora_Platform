name: ZolexoraAI — E2E (Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Frontend E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build frontend
        run: pnpm --filter @zolexora/ai-frontend build

      - name: Serve built frontend
        run: |
          npx http-server products/zolexora-ai/frontend/dist -p 8080 &
          sleep 2

      - name: Install Playwright browsers
        run: |
          cd products/zolexora-ai/frontend/e2e
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          cd products/zolexora-ai/frontend/e2e
          npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: products/zolexora-ai/frontend/e2e/playwright-report/
          retention-days: 14
