name: Zolexora AI — E2E (Playwright)

on:
  push:
    branches: [main]
    paths: ['products/zolexora-ai/apps/web/**', '.github/workflows/zolexora-ai-e2e.yml']
  pull_request:
    paths: ['products/zolexora-ai/apps/web/**', '.github/workflows/zolexora-ai-e2e.yml']

permissions:
  contents: read

jobs:
  e2e:
    name: Frontend E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node
        with:
          install: --frozen-lockfile --ignore-scripts

      - name: Build frontend
        run: pnpm --filter @zolexora/ai-web build

      - name: Serve built frontend
        run: |
          npx http-server products/zolexora-ai/apps/web/dist -p 8080 &
          sleep 2

      - name: Install Playwright browsers
        run: |
          cd products/zolexora-ai/apps/web/e2e
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          cd products/zolexora-ai/apps/web/e2e
          npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: products/zolexora-ai/apps/web/e2e/playwright-report/
          retention-days: 14
