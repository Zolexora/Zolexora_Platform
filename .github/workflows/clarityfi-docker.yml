name: ClarityFi — Docker images

# Builds every image in apps/standalone-apps/clarityfi/compose.yaml and pushes ghcr.io/zolexora/zolexora-clarityfi-<service>:{latest,<sha>}.
on:
  push:
    branches: [main]
    paths:
      - 'apps/standalone-apps/clarityfi/**'
      - 'packages/**'
      - 'infrastructure/containers/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/clarityfi-docker.yml'
      - '.github/workflows/reusable-docker-ghcr.yml'
      - '.github/actions/docker-login/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      product: clarityfi
      services: |
        [
          {
            "service": "backend",
            "file": "apps/standalone-apps/clarityfi/Dockerfile.api"
          },
          {
            "service": "frontend",
            "file": "apps/standalone-apps/clarityfi/Dockerfile.web"
          },
          {
            "service": "nginx",
            "file": "apps/standalone-apps/clarityfi/Dockerfile.nginx"
          }
        ]
