name: Zolexora IronClub — Docker images

# Builds every image in apps/standalone-apps/ironclub/compose.yaml and pushes ghcr.io/zolexora/zolexora-ironclub-<service>:{latest,<sha>}.
on:
  push:
    branches: [main]
    paths:
      - 'apps/standalone-apps/ironclub/**'
      - 'packages/**'
      - 'infrastructure/containers/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ironclub-docker.yml'
      - '.github/workflows/reusable-docker-ghcr.yml'
      - '.github/actions/docker-login/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      product: ironclub
      services: |
        [
          {
            "service": "backend",
            "file": "apps/standalone-apps/ironclub/services/backend/Dockerfile"
          }
        ]
