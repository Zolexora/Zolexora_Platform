name: Zolexora AI — Docker images

# Builds every image in apps/core-platform/zolexora-ai/compose.yaml and pushes ghcr.io/zolexora/zolexora-ai-<service>:{latest,<sha>}.
on:
  push:
    branches: [main]
    paths:
      - 'apps/core-platform/zolexora-ai/**'
      - 'packages/**'
      - 'infrastructure/containers/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/zolexora-ai-docker.yml'
      - '.github/workflows/reusable-docker-ghcr.yml'
      - '.github/actions/docker-login/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      product: ai
      services: |
        [
          {
            "service": "backend",
            "file": "apps/core-platform/zolexora-ai/services/api/Dockerfile",
            "target": "production"
          },
          {
            "service": "frontend",
            "file": "apps/core-platform/zolexora-ai/apps/web/Dockerfile"
          },
          {
            "service": "nginx",
            "file": "apps/core-platform/zolexora-ai/Dockerfile.nginx"
          }
        ]
