name: Zolexora Engage — Docker images

# Builds every image in apps/core-platform/zolexora-engage/compose.yaml and pushes ghcr.io/zolexora/zolexora-engage-<service>:{latest,<sha>}.
on:
  push:
    branches: [main]
    paths:
      - 'apps/core-platform/zolexora-engage/**'
      - 'packages/**'
      - 'infrastructure/containers/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/zolexora-engage-docker.yml'
      - '.github/workflows/reusable-docker-ghcr.yml'
      - '.github/actions/docker-login/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      product: engage
      services: |
        [
          {
            "service": "api",
            "file": "apps/core-platform/zolexora-engage/Dockerfile.api"
          },
          {
            "service": "nginx",
            "file": "apps/core-platform/zolexora-engage/Dockerfile.nginx"
          },
          {
            "service": "web",
            "file": "apps/core-platform/zolexora-engage/Dockerfile.web"
          }
        ]
