name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      - name: Shell syntax
        run: |
          bash -n scripts/*.sh
      - name: Python formatting and lint
        run: |
          black --check apps/zolexora_core apps/zolexora_branding apps/zolexora_platform apps/zolexora_integrations
          ruff check apps/zolexora_core apps/zolexora_branding apps/zolexora_platform apps/zolexora_integrations
      - name: Documentation files exist
        run: |
          test -f docs/production-guide.md
          test -f docs/security-review.md
          test -f docs/disaster-recovery-report.md
          test -f docs/upgrade-validation-report.md
          test -f docs/phase-3.8-production-certification-report.md

  docker-operational-validation:
    runs-on: ubuntu-latest
    needs: static-validation
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Copy Env Template
        run: cp .env.example .env
      - name: Build Docker images
        run: docker compose -f compose.yaml build --pull
      - name: Start Compose stack
        run: docker compose -f compose.yaml up -d
      - name: Run clean bootstrap
        run: ./scripts/init-site.sh
      - name: Run idempotent bootstrap
        run: ./scripts/init-site.sh
      - name: Run healthcheck
        run: ./scripts/healthcheck.sh
      - name: Generate verified backup
        run: ./scripts/backup.sh
      - name: Restore latest backup
        run: |
          latest_backup="$(find backups -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          ./scripts/restore.sh "$latest_backup"
      - name: Custom app import checks
        run: |
          docker compose -f compose.yaml exec -T backend /home/frappe/frappe-bench/env/bin/python - <<'PY'
          import importlib
          for module in (
              "zolexora_core",
              "zolexora_branding",
              "zolexora_platform",
              "zolexora_integrations",
          ):
              importlib.import_module(module)
          print("custom app imports ok")
          PY
      - name: Upgrade compatibility validation without image upgrade
        run: ./scripts/upgrade-validation.sh
      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml down -v

  destructive-disaster-recovery:
    runs-on: ubuntu-latest
    needs: docker-operational-validation
    if: false
    steps:
      - run: |
          echo "Full destructive DR is intentionally disabled in lightweight CI."
          echo "Run locally or in staging with ZOLEXORA_ALLOW_DESTRUCTIVE_DR=1 ./scripts/disaster-recovery-test.sh"
