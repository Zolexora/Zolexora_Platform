name: Build & Publish Zolexora App Suite Containers to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'products/zolexora-appsuite/**'
      - 'platform/auth/user-auth-core/**'
      - '.github/workflows/docker-ghcr-appsuite.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-appsuite-images:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: appsuite-backend
            context: .
            file: ./products/zolexora-appsuite/Dockerfile.backend
          - service: appsuite-client
            context: .
            file: ./products/zolexora-appsuite/Dockerfile.client
          - service: appsuite-team
            context: .
            file: ./products/zolexora-appsuite/Dockerfile.devteam
          - service: appsuite-nginx
            context: .
            file: ./products/zolexora-appsuite/Dockerfile.nginx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch AppSuite secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: "188824cd-59ce-468f-b60f-f2da7aeefe63"
          env-slug: dev
          secret-path: /Zolexora_AppSuite
          export-type: env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase repository and image tag
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_OWNER}/${{ matrix.service }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Pre-built container for ${{ matrix.service }} in Zolexora Platform
          build-args: |
            NEXT_PUBLIC_API_URL=https://appsuite-api.onrender.com
            NEXT_PUBLIC_CLIENT_URL=https://appsuite-client.onrender.com
            NEXT_PUBLIC_DEV_TEAM_URL=https://appsuite-team.onrender.com
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ matrix.service == 'appsuite-team' && env.NEXT_PUBLIC_APPSUITE_DEVTEAM_FIREBASE_API_KEY || env.NEXT_PUBLIC_APPSUITE_CLIENT_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ matrix.service == 'appsuite-team' && env.NEXT_PUBLIC_APPSUITE_DEVTEAM_FIREBASE_AUTH_DOMAIN || env.NEXT_PUBLIC_APPSUITE_CLIENT_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ matrix.service == 'appsuite-team' && env.NEXT_PUBLIC_APPSUITE_DEVTEAM_FIREBASE_PROJECT_ID || env.NEXT_PUBLIC_APPSUITE_CLIENT_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ matrix.service == 'appsuite-team' && env.NEXT_PUBLIC_APPSUITE_DEVTEAM_FIREBASE_STORAGE_BUCKET || env.NEXT_PUBLIC_APPSUITE_CLIENT_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ matrix.service == 'appsuite-team' && env.NEXT_PUBLIC_APPSUITE_DEVTEAM_FIREBASE_MESSAGING_SENDER_ID || env.NEXT_PUBLIC_APPSUITE_CLIENT_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ matrix.service == 'appsuite-team' && env.NEXT_PUBLIC_APPSUITE_DEVTEAM_FIREBASE_APP_ID || env.NEXT_PUBLIC_APPSUITE_CLIENT_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ matrix.service == 'appsuite-team' && env.NEXT_PUBLIC_APPSUITE_DEVTEAM_FIREBASE_MEASUREMENT_ID || env.NEXT_PUBLIC_APPSUITE_CLIENT_FIREBASE_MEASUREMENT_ID }}
            NEXT_PUBLIC_FIREBASE_DEVTEAM_API_KEY=${{ env.NEXT_PUBLIC_APPSUITE_DEVTEAM_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_DEVTEAM_AUTH_DOMAIN=${{ env.NEXT_PUBLIC_APPSUITE_DEVTEAM_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_DEVTEAM_PROJECT_ID=${{ env.NEXT_PUBLIC_APPSUITE_DEVTEAM_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_DEVTEAM_STORAGE_BUCKET=${{ env.NEXT_PUBLIC_APPSUITE_DEVTEAM_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_DEVTEAM_MESSAGING_SENDER_ID=${{ env.NEXT_PUBLIC_APPSUITE_DEVTEAM_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_DEVTEAM_APP_ID=${{ env.NEXT_PUBLIC_APPSUITE_DEVTEAM_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_DEVTEAM_MEASUREMENT_ID=${{ env.NEXT_PUBLIC_APPSUITE_DEVTEAM_FIREBASE_MEASUREMENT_ID }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
