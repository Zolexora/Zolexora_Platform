name: Zolexora IMS — Docker images

# Builds every image in apps/core-platform/zolexora-ims/compose.yaml and pushes ghcr.io/zolexora/zolexora-ims-<service>:{latest,<sha>}.
on:
  push:
    branches: [main]
    paths:
      - 'apps/core-platform/zolexora-ims/**'
      - 'packages/**'
      - 'infrastructure/containers/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/zolexora-ims-docker.yml'
      - '.github/workflows/reusable-docker-ghcr.yml'
      - '.github/actions/docker-login/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    uses: ./.github/workflows/reusable-docker-ghcr.yml
    with:
      product: ims
      services: |
        [
          {
            "service": "user-backend",
            "file": "apps/core-platform/zolexora-ims/services/user-api/Dockerfile"
          },
          {
            "service": "user-frontend",
            "file": "apps/core-platform/zolexora-ims/apps/ims-user/frontend/Dockerfile"
          }
        ]
