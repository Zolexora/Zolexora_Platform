# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  # ── ClarityFi Web Frontend ─────────────────────────────────────────────────
  - type: web
    name: clarityfi-web
    runtime: docker
    plan: free
    region: oregon
    rootDir: products/clarityfi
    dockerfilePath: Dockerfile.web
    # dockerContext defaults to rootDir (products/clarityfi) — correct for Dockerfile.web
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production

  # ── ClarityFi API Server ───────────────────────────────────────────────────
  - type: web
    name: clarityfi-api
    runtime: docker
    plan: free
    region: oregon
    # Dockerfile.api copies monorepo root files (package.json, pnpm-workspace.yaml, packages/, products/clarityfi)
    # so dockerContext must be the repo root — rootDir is NOT set here
    dockerfilePath: products/clarityfi/Dockerfile.api
    # dockerContext defaults to repo root (.) — correct for Dockerfile.api
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "8080"
      - key: NODE_ENV
        value: production
      # Add DATABASE_URL manually in the Render Dashboard after deploy
      # - key: DATABASE_URL
      #   sync: false
